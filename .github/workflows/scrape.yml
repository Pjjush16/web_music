name: Scrape Audio Library

on:
  push:
    paths:
      - 'audio/**'
      - 'scripts/**'
      - '.github/workflows/scrape.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libchromaprint-tools

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests mutagen pyacoustid

      - name: Scrape
        env:
          ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
        run: python scripts/scrape.py

      - name: Build manifest
        run: python scripts/build_manifest.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/ manifest.json scrape_state.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动刮削音频元数据、封面与歌词 [skip ci]"
            git push
          fi
