<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YAONET · 沉浸式音频播放器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0f0f; --surface:rgba(25, 25, 25, 0.65); --text:#fff; --text-2:rgba(255,255,255,.6); --text-3:rgba(255,255,255,.4);
    --border:rgba(255,255,255,.1); --accent:#fff; --accent-soft:rgba(255,255,255,.15);
    --radius-lg:24px; --radius-md:16px; --radius-sm:10px;
    --font:'Manrope',system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --shadow-sm:0 4px 12px rgba(0,0,0,.3); --shadow-md:0 10px 30px rgba(0,0,0,.5);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html, body {
    height: 100%; overflow: hidden; /* 防止整个页面滚动 */
    font-family:var(--font); background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased;
    user-select: none; /* 防止拖拽时选中文字 */
  }
  a{color:inherit;text-decoration:none}
  button{font-family:var(--font); border:none; background:none; color:inherit; cursor:pointer; outline:none;}

  /* ==================== 动态沉浸背景 ==================== */
  .app-bg {
    position: fixed; inset: 0; z-index: -1;
    background: #0f0f0f;
    transition: background 1s ease;
  }

  /* ==================== 顶部极简导航 ==================== */
  .site-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    pointer-events: none; /* 让背后的卡片可点击 */
  }
  .site-brand { font-size: 1.2rem; font-weight: 800; letter-spacing: -.03em; pointer-events: auto; opacity: .8;}
  .header-right { display: flex; align-items: center; gap: 16px; pointer-events: auto; }
  
  /* 悬浮分类标签 */
  .cat-tabs {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 4px; background: rgba(255,255,255,.08); border-radius: 999px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex-shrink: 0; font-size: .8rem; font-weight: 600; padding: 6px 16px;
    border-radius: 999px; color: rgba(255,255,255,.6); transition: all .2s;
  }
  .cat-tab:hover { color: #fff; }
  .cat-tab.active { background: rgba(255,255,255,.2); color: #fff; }

  .settings-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); backdrop-filter: blur(4px); transition: background .2s; }
  .settings-btn:hover { background: rgba(255,255,255,.2); }
  .settings-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; }

  /* ==================== 核心区：沉浸视图 + 3D 唱片流 ==================== */
  .main-stage {
    display: flex; flex-direction: column; height: 100%; padding-bottom: 110px; /* 为底部 Dock 留空 */
  }

  /* 上半部分：黑胶与歌词 */
  .immersive-top {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 60px 32px 0; gap: 8vw; min-height: 0;
  }

  /* 左侧黑胶 */
  .np-art {
    position: relative; width: min(320px, 30vw); aspect-ratio: 1; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .np-vinyl {
    width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.15), transparent 40%), repeating-radial-gradient(circle at center,#1a1a1a 0 1px,#0d0d0d 1px 4px);
    box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.05);
    position: relative; animation: spin 15s linear infinite; animation-play-state: paused;
    transition: transform .1s;
  }
  .is-playing .np-vinyl { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  /* 黑胶中心标签（取自封面） */
  .np-vinyl::before {
    content: ''; position: absolute; width: 45%; height: 45%; border-radius: 50%;
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: var(--vinyl-label, #333);
    box-shadow: 0 0 20px rgba(0,0,0,.5);
    background-size: cover; background-position: center;
  }
  .np-vinyl::after {
    content: ''; position: absolute; width: 6%; height: 6%; border-radius: 50%;
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
  }
  .np-cover-thumb {
    position: absolute; inset: 10%; border-radius: 50%; z-index: 2; opacity: 0; pointer-events: none;
  }
  
  /* 右侧滚动歌词 */
  .np-lyrics-container {
    width: 100%; max-width: 400px; height: 100%; max-height: 300px;
    overflow-y: auto; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
    mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
    padding: 40px 0;
  }
  .np-lyrics-container::-webkit-scrollbar { display: none; }
  .lyric-line {
    font-size: 1rem; line-height: 2.2; color: rgba(255,255,255,.3);
    padding: 4px 0; transition: all .3s; font-weight: 600; text-align: left;
  }
  .lyric-line.active {
    color: #fff; font-size: 1.15rem; font-weight: 800; text-shadow: 0 2px 12px rgba(255,255,255,.2);
  }

  /* 下半部分：3D 卡片选择器 */
  .cover-stage {
    height: 260px; width: 100%; position: relative;
    perspective: 1200px; /* 3D 透视深度 */
    display: flex; align-items: center; overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
    mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
    cursor: grab;
  }
  .cover-stage:active { cursor: grabbing; }
  
  .cover-track {
    display: flex; align-items: center; gap: 16px;
    padding: 0 calc(50vw - 110px); /* 确保最左和最右可以滚到中心 */
    height: 100%; overflow-x: auto; scrollbar-width: none;
    transform-style: preserve-3d;
  }
  .cover-track::-webkit-scrollbar { display: none; }

  .cover-card {
    flex-shrink: 0; width: 220px; height: 220px; border-radius: 16px;
    position: relative; background: #222;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out, opacity 0.1s, box-shadow 0.3s;
    will-change: transform, opacity;
  }
  .cover-card img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; pointer-events: none; }
  
  /* 选中卡片的发光效果 */
  .cover-card.is-centered {
    box-shadow: 0 0 0 2px rgba(255,255,255,.8), 0 20px 40px rgba(0,0,0,.6);
  }

  /* ==================== 底部 Dock ==================== */
  .player-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 150;
    background: rgba(20, 20, 20, 0.65);
    backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
    border-top: 1px solid rgba(255,255,255,.08);
    padding: 10px 24px 16px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 -10px 40px rgba(0,0,0,.3);
  }
  .bar-spectrum {
    position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 54px;
    pointer-events: none; z-index: -1;
    -webkit-mask-image: linear-gradient(to top, black 30%, transparent 100%);
    mask-image: linear-gradient(to top, black 30%, transparent 100%);
  }

  .pb-row-top {
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .pb-track { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }
  
  .pb-cover {
    width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0;
    background: rgba(255,255,255,.1); display: grid; place-items: center;
    overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }
  .pb-cover img { width: 100%; height: 100%; object-fit: cover; }
  .pb-cover::before { content: '♪'; position: absolute; font-size: 1.2rem; color: rgba(255,255,255,.5); z-index: 0;}
  .pb-cover img { position: relative; z-index: 1;}

  .pb-info { display: flex; flex-direction: column; min-width: 0; }
  .pb-title { font-size: .95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; line-height: 1.3; }
  .pb-artist { font-size: .8rem; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }

  .pb-controls { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .pb-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: rgba(255,255,255,.7); transition: all .2s; }
  .pb-btn:hover { color: #fff; background: rgba(255,255,255,.1); }
  .pb-btn:active { transform: scale(.92); }
  .pb-play { width: 46px; height: 46px; background: #fff; color: #1a1a1a; box-shadow: 0 4px 16px rgba(255,255,255,.2); }
  .pb-play:hover { background: #e0e0e0; color: #1a1a1a; transform: scale(1.05); }

  .pb-right { display: flex; align-items: center; justify-content: flex-end; gap: 16px; flex: 1; }
  .pb-vol { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,.5); }
  .pb-vol input { width: 80px; accent-color: #fff; cursor: pointer; }

  .pb-row-bottom { display: flex; align-items: center; gap: 12px; font-size: .75rem; color: rgba(255,255,255,.5); font-variant-numeric: tabular-nums; padding: 0 4px; }
  .pb-bar { flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,.15); position: relative; cursor: pointer; overflow: hidden; }
  .pb-bar-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 999px; background: #fff; width: 0%; transition: width .1s linear; }
  .pb-bar-fill::after { content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity .2s; }
  .pb-bar:hover .pb-bar-fill::after { opacity: 1; }

  /* ==================== 设置弹窗 ==================== */
  .settings-modal { position: fixed; inset: 0; z-index: 400; display: grid; place-items: center; padding: 24px; }
  .settings-modal[hidden] { display: none; }
  .settings-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(5px); animation: fadeIn .2s ease; }
  .settings-panel { position: relative; width: min(560px, 100%); max-height: calc(100vh - 48px); overflow-y: auto; background: #1a1a1a; border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.6); animation: modalIn .3s ease; color: #fff; }
  .settings-close { position: absolute; top: 16px; right: 20px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: rgba(255,255,255,.5); font-size: 1.4rem; transition: all .2s; }
  .settings-close:hover { background: rgba(255,255,255,.1); color: #fff; }
  .settings-panel h3 { font-size: 1.2rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: 6px; }
  .settings-sub { font-size: .85rem; color: rgba(255,255,255,.5); line-height: 1.6; margin-bottom: 20px; }
  
  .settings-tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .settings-tab { padding: 10px 16px; font-size: .85rem; font-weight: 600; color: rgba(255,255,255,.5); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .2s; }
  .settings-tab.active { color: #fff; border-bottom-color: #fff; }
  .settings-tab:hover { color: #fff; }

  .settings-label { display: block; font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: rgba(255,255,255,.4); margin-bottom: 8px; }
  .settings-input { width: 100%; font-family: var(--font); font-size: .85rem; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(0,0,0,.2); color: #fff; outline: none; transition: border-color .2s; }
  .settings-input:focus { border-color: #fff; }
  .settings-hint { font-size: .75rem; color: rgba(255,255,255,.4); margin-top: 8px; line-height: 1.5; }
  .settings-hint code { background: rgba(255,255,255,.1); color: #fff; padding: 2px 6px; border-radius: 4px; font-family: var(--mono); }
  .settings-current { font-size: .75rem; color: rgba(255,255,255,.5); margin-top: 12px; padding: 10px 14px; background: rgba(255,255,255,.05); border-radius: 12px; line-height: 1.6; word-break: break-all; }
  .settings-current strong { color: #fff; font-weight: 700; display: block; margin-bottom: 4px; }
  
  .settings-actions { display: flex; gap: 12px; justify-content: flex-end; align-items: center; margin-top: 28px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.1); }
  .settings-status { font-size: .8rem; margin-right: auto; align-self: center; }
  .settings-status.ok { color: #22c55e; }
  .settings-status.err { color: #ef4444; }
  .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 24px; border-radius: 999px; font-size: .9rem; font-weight: 600; transition: all .2s; }
  .btn-primary { background: #fff; color: #1a1a1a; }
  .btn-primary:hover { transform: scale(1.02); background: #e0e0e0; }
  .doc-panel { background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 16px; max-height: 300px; overflow-y: auto; }
  .doc-panel pre { margin: 0; font-family: var(--mono); font-size: .8rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: rgba(255,255,255,.7); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(.95); } to { opacity: 1; transform: none; } }

  /* 响应式适配 */
  @media (max-width: 820px) {
    .immersive-top { flex-direction: column; justify-content: flex-start; gap: 20px; padding-top: 80px; }
    .np-art { width: min(200px, 40vw); }
    .np-lyrics-container { text-align: center; max-height: 120px; margin-top: -10px; }
    .lyric-line { text-align: center; font-size: .9rem; line-height: 1.8; }
    .lyric-line.active { font-size: 1.05rem; }
    
    .cover-stage { height: 200px; }
    .cover-track { padding: 0 calc(50vw - 80px); gap: 12px; }
    .cover-card { width: 160px; height: 160px; }
    
    .pb-right { display: none; }
    .pb-row-top { gap: 12px; }
    .pb-title { font-size: .85rem; }
    .pb-artist { font-size: .75rem; }
    .pb-controls { gap: 8px; }
  }
</style>
</head>
<body>

<!-- 动态背景 -->
<div class="app-bg" id="app-bg"></div>

<!-- 顶部导航 -->
<header class="site-header">
  <div class="site-brand">YAONET</div>
  <div class="header-right">
    <div class="cat-tabs" id="tabs"></div>
    <button class="settings-btn" id="settings-btn" aria-label="清单设置">
      <svg viewBox="0 0 24 24"><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<!-- 主舞台 -->
<div class="main-stage">
  
  <!-- 上半部分：黑胶 + 歌词 -->
  <div class="immersive-top">
    <div class="np-art">
      <div class="np-vinyl" id="np-vinyl"></div>
    </div>
    <div class="np-lyrics-container" id="np-lyrics">
      <div class="lyric-line">请在下方选择一首歌开始播放</div>
    </div>
  </div>

  <!-- 下半部分：3D 唱片流 -->
  <div class="cover-stage" id="cover-stage">
    <div class="cover-track" id="cover-track">
      <!-- JS 动态注入卡片 -->
    </div>
  </div>

</div>

<!-- 底部 Dock -->
<div class="player-bar">
  <canvas class="bar-spectrum" id="bar-spectrum"></canvas>
  <div class="pb-row-top">
    <div class="pb-track">
      <div class="pb-cover" id="pb-cover">
        <img id="pb-cover-img" src="" alt="" style="display:none">
      </div>
      <div class="pb-info">
        <div class="pb-title" id="pb-title">未在播放</div>
        <div class="pb-artist" id="pb-artist">请选择曲目</div>
      </div>
    </div>
    <div class="pb-controls">
      <button class="pb-btn" id="btn-prev" aria-label="上一首">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12l-9-6z"/></svg>
      </button>
      <button class="pb-btn pb-play" id="btn-play" aria-label="播放">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="pb-btn" id="btn-next" aria-label="下一首">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l9 6-9 6z"/></svg>
      </button>
    </div>
    <div class="pb-right">
      <button class="pb-btn" id="btn-shuffle" aria-label="随机">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <div class="pb-vol">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
      </div>
    </div>
  </div>
  <div class="pb-row-bottom">
    <span id="cur-time">0:00</span>
    <div class="pb-bar" id="seek-bar"><div class="pb-bar-fill" id="seek-fill"></div></div>
    <span id="dur-time">0:00</span>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="settings-modal" id="settings-modal" hidden>
  <div class="settings-backdrop" data-settings-close></div>
  <div class="settings-panel">
    <button class="settings-close" type="button" data-settings-close>×</button>
    <h3>清单配置</h3>
    <p class="settings-sub">播放器读取一个 JSON 清单文件来加载曲目。</p>

    <div class="settings-tabs" id="settings-tabs">
      <button class="settings-tab active" type="button" data-tab="config">数据源</button>
      <button class="settings-tab" type="button" data-tab="docs">格式说明</button>
    </div>

    <div class="settings-tab-content" data-content="config">
      <div>
        <label class="settings-label" for="manifest-url">清单地址</label>
        <input class="settings-input" id="manifest-url" type="text" placeholder="留空则尝试 ./manifest.json" value="">
        <p class="settings-hint">若文件放在别处，填写完整 URL，并确保允许跨域访问。</p>
        <div class="settings-current" id="settings-current"></div>
      </div>
      <div class="settings-actions">
        <span class="settings-status" id="settings-status"></span>
        <button class="btn btn-primary" id="pf-test">测试读取</button>
        <button class="btn btn-primary" id="pf-save">保存并刷新</button>
      </div>
    </div>

    <div class="settings-tab-content" data-content="docs" hidden>
      <div class="doc-panel"><pre id="doc-pre"></pre></div>
    </div>
  </div>
</div>

<audio id="player" preload="metadata"></audio>

<script>
(function(){
  'use strict';

  var PALETTES = [
    ['#2d5a4a','#7fbfa8'], ['#4a3f5e','#9b8ec4'], ['#5e3f3a','#c49b8e'],
    ['#3a4a5e','#8ea9c4'], ['#5e4a3a','#c4ab8e'], ['#3a5e4a','#8ec4a9']
  ];

  var DOC_TEXT = [
    'manifest.json 数据格式',
    '──────────────────────────────────────────────',
    '',
    '{',
    '  "tracks": [',
    '    {',
    '      "id": "唯一标识",',

  // ==================== 动态主题与取色 ====================
  function lightenColor(rgb, amount){
    return [Math.min(255, rgb[0] + amount), Math.min(255, rgb[1] + amount), Math.min(255, rgb[2] + amount)];

  function extractColorFromImage(url, callback){
    if (!url) return callback(null);
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){
      try {
        var c = document.createElement('canvas');
        var size = 40; c.width = size; c.height = size;
        var cx = c.getContext('2d'); cx.drawImage(img, 0, 0, size, size);
        var data = cx.getImageData(0, 0, size, size).data;
        var r=0,g=0,b=0,n=0;
        for (var i=0;i<data.length;i+=4){
          var pr=data[i], pg=data[i+1], pb=data[i+2], pa=data[i+3];
          if (pa < 128) continue;
          var mx = Math.max(pr,pg,pb), mn = Math.min(pr,pg,pb);
          if (mx - mn < 20) continue; // 过滤灰暗色
          var br = (pr+pg+pb)/3;
          if (br < 30 || br > 220) continue; // 过滤极黑极白
          r+=pr; g+=pg; b+=pb; n++;
        }
        if (n === 0) return callback(null);
        callback([Math.round(r/n), Math.round(g/n), Math.round(b/n)]);
      } catch(e){ callback(null); }
    };
    img.onerror = function(){ callback(null); };
    img.src = url;
  }

  }

  // ==================== 歌词逻辑 ====================
  function parseLRC(text) {
    var lines = text.split('\n'), result = [];
    var timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
    
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var match = timeReg.exec(line);
      if (match) {
        var min = parseInt(match[1], 10), sec = parseInt(match[2], 10), ms = parseInt(match[3], 10);
        if (match[3].length === 2) ms *= 10;
        var time = min * 60 + sec + ms / 1000;
        var content = line.replace(timeReg, '').trim();
        if (content) result.push({ time: time, text: content });
      } else {
        if (!result.length) {
           return text.split('\n').filter(l=>l.trim()).map(l => ({ time: -1, text: l.trim() }));
        }
      }
    }
    return result;
  }

  function loadLyrics(track) {

    var lStr = track.lyrics;
    
    if (lStr.indexOf('[') === 0 || lStr.indexOf('\n') !== -1 || lStr.length > 150) {
      renderLyrics(parseLRC(lStr));
    } else {
      fetch(lStr)
        .then(r => { if (!r.ok) throw new Error(); return r.text(); })
        .then(text => { if (currentId === track.id) renderLyrics(parseLRC(text)); })
        .catch(e => { if (currentId === track.id) npLyricsCont.innerHTML = '<div class="lyric-line active">歌词加载失败或跨域</div>'; });
    }
  }

  function updateLyricsHighlight(currentTime) {

  // 滚动到指定卡片居中

  // 计算 3D 效果
  function updateCardTransforms() {
    var stageRect = coverStage.getBoundingClientRect();
    var stageCenter = stageRect.left + stageRect.width / 2;
    var cards = coverTrack.querySelectorAll('.cover-card');
    
    var closestCard = null;
    var minDistance = Infinity;

    cards.forEach(card => {
      var rect = card.getBoundingClientRect();
      var cardCenter = rect.left + rect.width / 2;
      var distance = stageCenter - cardCenter;
      var absDistance = Math.abs(distance);
      
      // 参数调优
      var maxRotate = 55; // 最大旋转角度
      var minScale = 0.7; // 边缘最小缩放
      
      var rotateY = (distance / stageRect.width) * maxRotate;
      rotateY = Math.max(-maxRotate, Math.min(maxRotate, rotateY));
      
      var scale = 1 - Math.min(absDistance / (stageRect.width / 2), 1) * (1 - minScale);
      var opacity = 1 - Math.min(absDistance / (stageRect.width / 1.2), 0.7);
      var zIndex = 100 - Math.floor(absDistance);

      card.style.transform = `perspective(1000px) rotateY(${rotateY}deg) scale(${scale})`;
      card.style.opacity = opacity;
      card.style.zIndex = zIndex;

      if (absDistance < minDistance) {
        minDistance = absDistance;
        closestCard = card;
      }
    });

    // 高亮居中卡片
    if (closestCard) {
      cards.forEach(c => c.classList.remove('is-centered'));
      closestCard.classList.add('is-centered');
    }
  }

  // ==================== 数据加载 ====================
  
  function buildCandidates(rawInput){
    var input = (rawInput || '').trim();
    if (input) return [input];
    var list = ['./manifest.json', '/manifest.json'], seen = {}, out = [];
    for (var i = 0; i < list.length; i++){
      var abs = absoluteUrl(list[i]);
      if (!seen[abs]){ seen[abs] = true; out.push(list[i]); }
    }
    return out;
  }

  function fetchManifest(url){
    return fetch(url, { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(text => {
        var data = JSON.parse(text);
        if (!data || !Array.isArray(data.tracks)) throw new Error('缺少 tracks 数组');
        return data;
      });
  }

  function fetchFirstAvailable(candidates){
    return new Promise((resolve, reject) => {
      var i = 0, errors = [];
      function next(){
        if (i >= candidates.length) return reject(new Error(errors[errors.length - 1] || '未找到清单'));
        var url = candidates[i++];
        fetchManifest(url)
          .then(data => resolve({ url, data }))
          .catch(e => { errors.push(absoluteUrl(url) + '：' + e.message); next(); });
      }
      next();
    });
  }

  function normalizeSongs(rawSongs, baseUrl){
    return rawSongs.filter(s => s && typeof s === 'object').map((s, i) => ({
      id: s.id || ('s' + i),
      title: s.title || '未命名',
      artist: s.artist || '',
      album: s.album || '',
      category: s.category || '未分类',
      src: resolveAsset(s.src, baseUrl),
      cover: resolveAsset(s.cover, baseUrl),
      lyrics: resolveAsset(s.lyrics, baseUrl)
    }));
  }

  function refreshLibrary(){
    fetchFirstAvailable(buildCandidates(sourceState.manifestUrl))
      .then(res => {
        currentManifestUrl = res.url;
        tracks = normalizeSongs(res.data.tracks, absoluteUrl(res.url));
        renderTabs();
        filterAndRenderCards();
        
        // 恢复状态或默认选第一首
        applyRestoredPlayerState();
        if (!currentId && filtered.length) {
          // 只是高亮，不自动播放
          currentId = filtered[0].id;
          updatePlayerUI(getTrack(currentId));
          scrollToCard(currentId, 'auto');
        }
      })
      .catch(e => {
        coverTrack.innerHTML = `<div style="color:#ef4444;padding:20px">加载失败: ${esc(e.message)}</div>`;
      });
  }

  function playTrack(id, forcePlay) {

  function togglePlay() {

      if (filtered.length) playTrack(filtered[0].id);

    if (i === -1) n = 0;
    playTrack(filtered[n].id, filtered.length === 1);

  function prevTrack() {

    var i = filtered.findIndex(t => t.id === currentId);
    var n = shuffleOn ? Math.floor(Math.random() * filtered.length) : (i - 1 + filtered.length) % filtered.length;

  }

  function applyRestoredPlayerState() {
    try {
      var raw = localStorage.getItem(PLAYER_KEY);
      if (!raw) return;
      var state = JSON.parse(raw);
      
      if (typeof state.volume === 'number') {
        audio.volume = Math.max(0, Math.min(1, state.volume));
        volEl.value = audio.volume;
      }
      if (state.shuffle) shuffleOn = true;

      if (state.trackId) {
        var t = getTrack(state.trackId);
        if (t) {
          currentId = t.id;
          updatePlayerUI(t);
          audio.src = t.src;
          var seekTo = state.currentTime || 0;
          audio.addEventListener('loadedmetadata', function onMeta(){
            audio.removeEventListener('loadedmetadata', onMeta);
            if (seekTo > 0 && seekTo < audio.duration) audio.currentTime = seekTo;
          });
        }
      }
    } catch(e){}
  }

  // ==================== 频谱动画 ====================
  var audioCtx = null, analyser = null, freqData = null, hasRealAudioData = false;
  var barSpectrumCanvas = document.getElementById('bar-spectrum');
  var barSpectrumCtx = barSpectrumCanvas.getContext('2d');
  var spectrumRAF = null;

  function setupAnalyser() {
    if (audioCtx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      var sourceNode = audioCtx.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      freqData = new Uint8Array(analyser.frequencyBinCount);
    } catch(e){}
  }

  function ensureAudioContext() {
    if (!audioCtx) setupAnalyser();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function generateFakeData(t){
    var arr = new Uint8Array(64);
    for (var i=0;i<64;i++){
      var v = Math.sin(t*0.003 + i*0.2) * Math.cos(t*0.001 - i*0.1);
      arr[i] = Math.floor((v + 1) / 2 * 255);
    }
    return arr;
  }

  function drawSpectrum() {
    var dpr = window.devicePixelRatio || 1;
    var w = barSpectrumCanvas.clientWidth, h = barSpectrumCanvas.clientHeight;
    if (!w || !h) return;
    if (barSpectrumCanvas.width !== w*dpr) { barSpectrumCanvas.width = w*dpr; barSpectrumCanvas.height = h*dpr; }
    
    barSpectrumCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    barSpectrumCtx.clearRect(0, 0, w, h);

    var data = generateFakeData(Date.now());
    if (analyser && freqData) {
      analyser.getByteFrequencyData(freqData);
      var sum = freqData.reduce((a,b)=>a+b, 0);
      if (sum > 100) { hasRealAudioData = true; data = freqData; }
    }

    var usable = Math.floor(data.length * 0.7);
    var bars = Math.floor(w / 6); // 尽量铺满
    var step = Math.max(1, Math.floor(usable / bars));
    var barW = w / bars;
    var gap = barW * 0.3;
    
    var grad = barSpectrumCtx.createLinearGradient(0, h, 0, 0);
    grad.addColorStop(0, `rgba(${spectrumColor.join(',')}, 0.6)`);
    grad.addColorStop(1, `rgba(${spectrumColorLight.join(',')}, 0.2)`);
    barSpectrumCtx.fillStyle = grad;

    for (var i=0;i<bars;i++){
      var sum=0, cnt=0;
      for (var j=0;j<step;j++){ if(i*step+j < usable){ sum+=data[i*step+j]; cnt++; } }
      var v = cnt ? sum/cnt/255 : 0;
      var bh = Math.max(2, Math.pow(v, 0.4) * h * 1.2);
      barSpectrumCtx.fillRect(i*barW + gap/2, h - bh, barW - gap, bh);
    }
  }

  function loopSpectrum() {
    drawSpectrum();
    if (isPlaying) spectrumRAF = requestAnimationFrame(loopSpectrum);
  }

  // ==================== 事件绑定 ====================
  
  audio.addEventListener('play', () => { isPlaying = true; ensureAudioContext(); syncPlayUI(); cancelAnimationFrame(spectrumRAF); loopSpectrum(); });
  audio.addEventListener('pause', () => { isPlaying = false; syncPlayUI(); savePlayerState(); });
  audio.addEventListener('ended', nextTrack);
  audio.addEventListener('timeupdate', updateProgress);

  btnPlay.addEventListener('click', togglePlay);
  btnPrev.addEventListener('click', prevTrack);
  btnNext.addEventListener('click', nextTrack);
  btnShuffle.addEventListener('click', () => {
    shuffleOn = !shuffleOn;
    btnShuffle.style.color = shuffleOn ? '#fff' : 'rgba(255,255,255,.7)';
    savePlayerState();
  });
  seekBar.addEventListener('click', e => {
    var rect = seekBar.getBoundingClientRect(), ratio = (e.clientX - rect.left) / rect.width;
    if (isFinite(audio.duration)) audio.currentTime = Math.max(0, Math.min(1, ratio)) * audio.duration;
  });
  volEl.addEventListener('input', () => { audio.volume = parseFloat(volEl.value); savePlayerState(); });

  tabsEl.addEventListener('click', e => {
    var btn = e.target.closest('.cat-tab');
    if (!btn) return;
    activeCat = btn.getAttribute('data-cat');
    renderTabs();
    filterAndRenderCards();
  });

  // 键盘快捷键
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    if (e.key === 'ArrowRight') nextTrack();
    if (e.key === 'ArrowLeft') prevTrack();
  });

  // 设置面板逻辑
  function loadSourceState(){
    try {
      var raw = localStorage.getItem(SOURCE_KEY);
      if (raw) sourceState = JSON.parse(raw);
    } catch(e){}
    manifestUrlEl.value = sourceState.manifestUrl || '';
    updateManifestHints();
  }
  function saveSourceState(){ try{ localStorage.setItem(SOURCE_KEY, JSON.stringify(sourceState)); }catch(e){} }
  
  function updateManifestHints(){
    var raw = (sourceState.manifestUrl || '').trim();
    var resolved = raw ? absoluteUrl(raw) : absoluteUrl('./manifest.json');
    settingsCurrent.innerHTML = `<strong>当前生效地址</strong>${resolved}`;
  }

  settingsBtn.addEventListener('click', () => { settingsModal.hidden = false; settingsStatus.textContent = ''; updateManifestHints(); });
  settingsModal.addEventListener('click', e => { if(e.target.closest('[data-settings-close]')) settingsModal.hidden = true; });
  
  settingsTabs.addEventListener('click', e => {
    var btn = e.target.closest('.settings-tab'); if(!btn) return;
    var name = btn.getAttribute('data-tab');
    settingsModal.querySelectorAll('.settings-tab').forEach(b => b.classList.toggle('active', b === btn));
    settingsModal.querySelectorAll('.settings-tab-content').forEach(c => c.hidden = c.getAttribute('data-content') !== name);
  });

  pfTest.addEventListener('click', () => {
    var raw = manifestUrlEl.value.trim();
    settingsStatus.className = 'settings-status'; settingsStatus.textContent = '正在测试…';
    fetchManifest(raw || 'manifest.json')
      .then(d => {
        settingsStatus.className = 'settings-status ok';
        settingsStatus.textContent = `成功，读取到 ${d.tracks.length} 首。`;
      })
      .catch(e => { settingsStatus.className = 'settings-status err'; settingsStatus.textContent = e.message; });
  });

  pfSave.addEventListener('click', () => {
    sourceState.manifestUrl = manifestUrlEl.value.trim();
    saveSourceState();
    settingsModal.hidden = true;
    refreshLibrary();
  });

  // 窗口大小改变时重新计算 3D 效果
  window.addEventListener('resize', () => {
    updateCardTransforms();
    drawSpectrum();
  });
  
  // 鼠标拖拽滚动支持
  let isDown = false, startX, scrollLeft;
  coverTrack.addEventListener('mousedown', (e) => {
    isDown = true;
    startX = e.pageX - coverTrack.offsetLeft;
    scrollLeft = coverTrack.scrollLeft;
  });
  coverTrack.addEventListener('mouseleave', () => isDown = false);
  coverTrack.addEventListener('mouseup', () => isDown = false);
  coverTrack.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - coverTrack.offsetLeft;
    const walk = (x - startX) * 2;
    coverTrack.scrollLeft = scrollLeft - walk;
  });

  // 启动
  loadSourceState();
  refreshLibrary();
})();
</script>
</body>
</html>
