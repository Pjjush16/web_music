<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YAONET · 音频播放器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ==================== 主题变量 ==================== */
  :root{
    --bg:#f7f6f3;--surface:#fff;--text:#1a1a1a;--text-2:#5f5f5f;--text-3:#8a8a8a;
    --border:rgba(0,0,0,.07);--accent:#2d5a4a;--accent-soft:#e8efec;
    --radius-lg:18px;--radius-md:14px;--radius-sm:10px;
    --font:'Manrope',system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);--shadow-md:0 8px 30px rgba(0,0,0,.06);
    
    --np-primary: #2d5a4a;
    --np-primary-light: #7fbfa8;
  }
  :root[data-theme="dark"]{
    --bg:#0f0f0f;--surface:#1a1a1a;--text:#f0f0f0;--text-2:#a0a0a0;--text-3:#6e6e6e;
    --border:rgba(255,255,255,.08);--accent:#7fbfa8;--accent-soft:#1f2e29;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 8px 30px rgba(0,0,0,.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    line-height: 1.65; -webkit-font-smoothing: antialiased;
    user-select: none; transition: background 0.3s, color 0.3s;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; outline: none; }

  .app-wrapper {
    display: flex; flex-direction: column; height: 100%; padding-bottom: 110px;
  }

  .site-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; z-index: 100; flex-shrink: 0;
  }
  .site-brand { font-size: 1.4rem; font-weight: 800; letter-spacing: -.03em; }
  .site-brand span { color: var(--accent); }

  .settings-btn {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
    box-shadow: var(--shadow-sm); transition: all 0.2s;
  }
  .settings-btn:hover { transform: rotate(18deg); color: var(--text); }
  .settings-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

  /* ==================== 3D Cover Flow ==================== */
  .main-stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }

  .cover-stage {
    width: 100%; height: 360px; position: relative;
    perspective: 1000px;
    display: flex; align-items: center; justify-content: center;
    cursor: grab;
    touch-action: none;
  }
  .cover-stage:active { cursor: grabbing; }

  .cover-track {
    position: absolute;
    left: 50%; top: 50%;
    width: 0; height: 0;
    transform-style: preserve-3d;
  }

  .cover-card {
    position: absolute;
    width: min(240px, 55vw);
    height: min(240px, 55vw);
    aspect-ratio: 1 / 1;             /* 新：防变形 */
    left: 50%; top: 50%;
    margin-left: calc(min(240px, 55vw) / -2);
    margin-top: calc(min(240px, 55vw) / -2);
    border-radius: 20px;
    background: var(--surface);
    box-shadow: var(--shadow-md); border: 1px solid var(--border);
    will-change: transform, opacity;
    overflow: hidden;
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }
  .cover-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .cover-card.no-cover { display: grid; place-items: center; font-size: 3rem; color: var(--text-3); background: var(--accent-soft); }
  .cover-card.is-centered { box-shadow: 0 0 0 3px var(--accent), 0 20px 40px rgba(0,0,0,0.2); }

  /* ==================== 底栏 Dock ==================== */
  .player-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 150;
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-top: 1px solid var(--border);
    padding: 12px 24px 16px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.04);
  }
  [data-theme="dark"] .player-bar { box-shadow: 0 -4px 24px rgba(0,0,0,0.3); }

  .bar-spectrum {
    position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 56px;
    pointer-events: none; z-index: -1;
    -webkit-mask-image: linear-gradient(to top, black 30%, transparent 100%);
    mask-image: linear-gradient(to top, black 30%, transparent 100%);
  }

  .pb-row-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .pb-track { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }

  .pb-cover {
    position: relative;                        /* 修复：让 ♪ 定位在封面内 */
    width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
    background: var(--accent-soft); display: grid; place-items: center;
    overflow: hidden; box-shadow: var(--shadow-sm); cursor: pointer;
    transition: transform 0.2s;
  }
  .pb-cover:hover { transform: scale(1.05); }
  .pb-cover img { width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 1; }
  .pb-cover::before { content: '♪'; position: absolute; font-size: 1.2rem; color: var(--text-3); z-index: 0; }
  .pb-cover.has-cover::before { display: none; }

  .pb-info { display: flex; flex-direction: column; min-width: 0; }
  .pb-title { font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); line-height: 1.3; }
  .pb-artist { font-size: 0.8rem; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }

  .pb-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .pb-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); transition: all 0.2s; }
  .pb-btn:hover { color: var(--text); background: var(--border); }
  .pb-btn:active { transform: scale(0.92); }
  .pb-play { width: 44px; height: 44px; background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(45,90,74,0.3); }
  [data-theme="dark"] .pb-play { color: #0f0f0f; }
  .pb-play:hover { transform: scale(1.05); background: var(--accent); color: #fff; }

  .pb-row-bottom {
    display: flex; align-items: center; gap: 12px;
    font-size: 0.75rem; color: var(--text-3); font-variant-numeric: tabular-nums; padding: 0 4px;
  }
  .pb-bar { flex: 1; height: 4px; border-radius: 999px; background: var(--border); position: relative; cursor: pointer; overflow: hidden; }
  .pb-bar-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 999px; background: var(--text); width: 0%; transition: width 0.1s linear; }

  /* ==================== 全屏 Now Playing ==================== */
  .now-playing{position:fixed;inset:0;z-index:300;overflow:hidden}
  .now-playing[hidden]{display:none}
  .np-backdrop{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(28px) saturate(160%);animation:npFade .3s ease both;}
  @keyframes npFade{from{opacity:0}to{opacity:1}}

  .np-icon-btn{position:absolute;top:22px;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);display:grid;place-items:center;transition:all .2s;backdrop-filter:blur(10px);}
  .np-icon-btn:hover{background:rgba(255,255,255,.2);color:#fff;transform:scale(1.05)}
  .np-icon-btn.active{color:#fff;background:rgba(255,255,255,.3);border-color:transparent}
  .np-close-btn { left: 24px; }
  .np-lyric-btn { right: 24px; }

  .np-spectrum{position:absolute;left:0;right:0;bottom:0;width:100vw;height:130px;pointer-events:none;z-index:1;-webkit-mask-image:linear-gradient(to top, black 30%, transparent 100%);mask-image:linear-gradient(to top, black 30%, transparent 100%);}

  /* 基础排版：默认手机竖屏的上下结构 */
  .np-content{
    position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;
    width:100%;max-width:720px;padding:0 24px;max-height:calc(100vh - 100px);
  }
  .np-view-cover{
    display:flex;flex-direction:column;align-items:center;
    transition:opacity .3s,transform .3s;width:100%;
    flex-shrink: 0;
  }
  .np-view-cover.hidden{opacity:0;pointer-events:none;transform:scale(.95);}

  .np-art{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:20px;flex-shrink:0;}
  .np-cover{
    width:min(300px,55vw);height:min(300px,55vw);
    aspect-ratio: 1 / 1;
    border-radius:min(20px,4vw);position:relative;z-index:2;box-shadow:0 30px 80px rgba(0,0,0,.35);
    display:grid;place-items:center;background:var(--accent-soft);overflow:hidden;flex-shrink: 0;
  }
  .np-cover::before{content:'♪';color:rgba(255,255,255,.9);font-size:clamp(2.4rem,7vw,3.6rem);position:absolute}
  .np-cover img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}

  .np-vinyl{
    width:min(280px,52vw);height:min(280px,52vw);
    aspect-ratio: 1 / 1;
    margin-left:calc(min(280px,52vw) * -0.5);
    position:relative;z-index:1;flex-shrink: 0;
    animation:vinylIn .55s cubic-bezier(.22,1,.36,1) .08s both;
  }
  @keyframes vinylIn{from{transform:translateX(-45%) scale(.84) rotate(-18deg);opacity:0}to{transform:translateX(0) scale(1) rotate(0);opacity:1}}
  .np-vinyl-disc{
    width:100%;height:100%;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.10),transparent 46%),repeating-radial-gradient(circle at center,#1d1d1d 0 1px,#0d0d0d 1px 3px);
    position:relative;animation:spin 10s linear infinite;animation-play-state:paused;flex-shrink:0;
  }
  .now-playing.is-playing .np-vinyl-disc{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}
  .np-vinyl-disc::before{content:'';position:absolute;width:45%;height:45%;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--vinyl-label,var(--np-primary));background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22);}
  .np-vinyl-disc::after{content:'';position:absolute;width:8%;height:8%;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);background:#0a0a0a;}

  .np-info{text-align:center;max-width:100%;padding:0 12px;margin-bottom:24px;}
  .np-info h2{font-size:clamp(1.3rem,3.2vw,1.7rem);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e0e0e0;margin-bottom:4px;}
  .np-info p{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,0.5);}

  .np-view-lyrics{
    position:absolute;top:0;left:0;right:0;bottom:140px;display:block;opacity:0;pointer-events:none;
    transition:opacity .3s;overflow-y:auto;scrollbar-width:none;padding:30vh 0 20vh;box-sizing:border-box;
    scroll-behavior:smooth;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 15%,black 85%,transparent 100%);
    mask-image:linear-gradient(to bottom,transparent 0%,black 15%,black 85%,transparent 100%);
  }
  .np-view-lyrics.hidden{display:none;}
  .np-view-lyrics.active{opacity:1;pointer-events:auto;}
  .np-view-lyrics::-webkit-scrollbar{display:none;}
  #np-lyrics-content{display:flex;flex-direction:column;align-items:center;width:100%;}
  .lyric-line{font-size:1.1rem;line-height:1.6;color:rgba(255,255,255,.3);text-align:center;padding:12px 0;transition:color .3s,transform .3s;font-weight:600;}
  .lyric-line.active{color:rgba(255,255,255,.85);font-size:1.25rem;font-weight:800;transform:scale(1.02);}

  .np-progress-row{display:flex;align-items:center;gap:12px;width:100%;max-width:320px;font-size:.75rem;color:rgba(255,255,255,.4);margin-bottom:16px;z-index:10;}
  .np-bar{flex:1;height:4px;border-radius:999px;background:rgba(255,255,255,.15);position:relative;cursor:pointer;overflow:hidden;}
  .np-bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:999px;background:var(--np-primary-light);width:0%;transition:width .1s linear;}

  .np-controls{display:flex;align-items:center;justify-content:center;gap:24px;width:100%;z-index:10;flex-shrink:0;}
  .np-btn{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);display:grid;place-items:center;transition:all .2s;flex-shrink:0;}
  .np-btn:hover{background:rgba(255,255,255,.2);color:#fff;}
  .np-btn.np-main{width:64px;height:64px;background:var(--np-primary-light);color:#fff;border-color:transparent;box-shadow:0 12px 30px color-mix(in srgb,var(--np-primary) 50%,transparent);}

  /* ==================== 宽屏/横屏：双栏布局 ==================== */
  @media (min-aspect-ratio: 1/1), (min-width: 768px) {
    .np-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr auto auto;
      grid-template-areas:
        "cover lyrics"
        "progress progress"
        "controls controls";
      max-width: 1100px;
      width: 90%;
      height: 85vh;
      gap: 10px 40px;
      padding: 0;
      align-items: center;
      align-content: center;
    }

    .np-view-cover {
      grid-area: cover;
      justify-content: center;
      height: 100%;
    }
    .np-cover {
      width: min(360px, 32vw, 45vh);
      height: min(360px, 32vw, 45vh);
    }
    .np-vinyl {
      width: min(320px, 28vw, 40vh);
      height: min(320px, 28vw, 40vh);
      margin-left: calc(min(320px, 28vw, 40vh) * -0.5);
    }

    /* 右侧歌词，脱离绝对定位，自然铺满 */
    .np-view-lyrics {
      grid-area: lyrics;
      position: relative;
      inset: auto;
      bottom: auto;
      height: 100%;
      width: 100%;
      opacity: 1;
      pointer-events: auto;
      padding: 10vh 0;
    }

    /* 宽屏下歌词始终展示，隐藏切换按钮 */
    .np-lyric-btn { display: none !important; }

    .np-progress-row { grid-area: progress; max-width: 60%; margin: 0 auto; }
    .np-controls { grid-area: controls; }
  }

  /* ==================== 设置弹窗 ==================== */
  .settings-modal{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:24px;}
  .settings-modal[hidden]{display:none;}
  .settings-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);}
  .settings-panel{position:relative;width:min(500px,100%);max-height:calc(100vh - 48px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:var(--shadow-md);}
  .settings-close{position:absolute;top:16px;right:20px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--text-3);font-size:1.4rem;}
  .settings-panel h3{font-size:1.2rem;font-weight:800;margin-bottom:6px;}
  .settings-sub{font-size:.85rem;color:var(--text-2);margin-bottom:20px;}
  .settings-tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);}
  .settings-tab{padding:10px 16px;font-size:.85rem;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .settings-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .settings-label{display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;}
  .settings-input{width:100%;font-family:inherit;font-size:.85rem;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none;}
  .settings-hint{font-size:.75rem;color:var(--text-3);margin-top:8px;}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
  .settings-row-title{font-size:.9rem;font-weight:600;}
  .settings-row-desc{font-size:.75rem;color:var(--text-3);margin-top:4px;}
  .switch{position:relative;display:inline-block;width:44px;height:24px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background-color:var(--border);transition:.3s;border-radius:24px;}
  .slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background-color:#fff;transition:.3s;border-radius:50%;}
  input:checked+.slider{background-color:var(--accent);}
  input:checked+.slider:before{transform:translateX(20px);}
  .settings-actions{display:flex;gap:12px;justify-content:flex-end;align-items:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--border);}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 24px;border-radius:999px;font-size:.9rem;font-weight:600;}
  .btn-primary{background:var(--accent);color:#fff;}
  .doc-panel{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;max-height:300px;overflow-y:auto;}
  .doc-panel pre{margin:0;font-family:var(--mono);font-size:.8rem;white-space:pre-wrap;word-break:break-word;color:var(--text-2);}

  /* ==================== 超小屏（手表）适配 ==================== */
  @media (max-width: 320px) {
    .site-brand { font-size: 1rem; }
    .settings-btn { width: 32px; height: 32px; }
    .cover-stage { height: 200px; }
    .cover-card { width: 70vw; height: 70vw; margin-left: -35vw; margin-top: -35vw; }
    .player-bar { padding: 8px 12px; }
    .pb-cover { width: 32px; height: 32px; }
    .pb-title { font-size: 0.75rem; }
    .pb-artist { font-size: 0.65rem; }
    .pb-btn { width: 28px; height: 28px; }
    .pb-play { width: 36px; height: 36px; }
    .np-icon-btn { width: 32px; height: 32px; top: 12px; }
    .np-close-btn { left: 12px; }
    .np-lyric-btn { right: 12px; }
    .np-cover { width: min(180px, 55vw); height: min(180px, 55vw); }
    .np-vinyl { width: min(160px, 50vw); height: min(160px, 50vw); margin-left: calc(min(160px, 50vw) * -0.5); }
    .np-info h2 { font-size: 1rem; }
    .np-info p { font-size: 0.75rem; }
    .np-progress-row { margin-bottom: 8px; }
    .np-btn { width: 36px; height: 36px; }
    .np-btn.np-main { width: 48px; height: 48px; }
    .lyric-line { font-size: 0.9rem; padding: 8px 0; }
    .lyric-line.active { font-size: 1.05rem; }
  }
</style>
</head>
<body>

<div class="app-wrapper">
  <header class="site-header">
    <div class="site-brand">YAO<span>NET</span></div>
    <button class="settings-btn" id="settings-btn" aria-label="设置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main class="main-stage">
    <div class="cover-stage" id="cover-stage">
      <div class="cover-track" id="cover-track"></div>
    </div>
  </main>
</div>

<div class="player-bar" id="player-bar">
  <canvas class="bar-spectrum" id="bar-spectrum"></canvas>
  <div class="pb-row-top">
    <div class="pb-track">
      <div class="pb-cover" id="pb-cover"><img id="pb-cover-img" src="" alt="" style="display:none"></div>
      <div class="pb-info">
        <div class="pb-title" id="pb-title">未在播放</div>
        <div class="pb-artist" id="pb-artist">请选择曲目</div>
      </div>
    </div>
    <div class="pb-controls">

<script>
(function(){
  'use strict';

  var DOC_TEXT = `manifest.json 数据格式
──────────────────────────────────────────────
{
  "tracks": [
    { "id": "唯一标识", "title": "曲目标题", "artist": "艺术家", "category": "分类", "src": "audio/001.mp3", "cover": "audio/001.jpg", "lyrics": "audio/001.lrc" }
  ]
}`;

  var coverStage = document.getElementById('cover-stage');
  var coverTrack = document.getElementById('cover-track');
  var pbCover = document.getElementById('pb-cover');
  var pbCoverImg = document.getElementById('pb-cover-img');
  var pbTitle = document.getElementById('pb-title');
  var pbArtist = document.getElementById('pb-artist');
  var btnPlay = document.getElementById('btn-play');
  var btnPrev = document.getElementById('btn-prev');
  var btnNext = document.getElementById('btn-next');
  var seekBar = document.getElementById('seek-bar');
  var seekFill = document.getElementById('seek-fill');
  var curTimeEl = document.getElementById('cur-time');
  var durTimeEl = document.getElementById('dur-time');
  var audio = document.getElementById('player');

  var npModal = document.getElementById('now-playing');
  var npContent = document.getElementById('np-content');
  var npBackdrop = document.querySelector('.np-backdrop');
  var npCover = document.getElementById('np-cover');
  var npVinylDisc = document.getElementById('np-vinyl-disc');
  var npTitle = document.getElementById('np-title');
  var npArtist = document.getElementById('np-artist');
  var npLyricsContent = document.getElementById('np-lyrics-content');
  var npViewCover = document.getElementById('np-view-cover');
  var npViewLyrics = document.getElementById('np-view-lyrics');
  var npToggleLyricsBtn = document.getElementById('np-toggle-lyrics');
  var npPlayBtn = document.getElementById('np-play');
  var npPrevBtn = document.getElementById('np-prev');
  var npNextBtn = document.getElementById('np-next');
  var npBar = document.getElementById('np-bar');
  var npFill = document.getElementById('np-fill');
  var npCur = document.getElementById('np-cur');
  var npDur = document.getElementById('np-dur');

  var settingsBtn = document.getElementById('settings-btn');
  var settingsModal = document.getElementById('settings-modal');
  var settingsTabs = document.getElementById('settings-tabs');
  var settingsStatus = document.getElementById('settings-status');
  var settingsCurrent = document.getElementById('settings-current');
  var manifestUrlEl = document.getElementById('manifest-url');
  var pfSave = document.getElementById('pf-save');
  var docPre = document.getElementById('doc-pre');
  var themeToggle = document.getElementById('theme-toggle');

  var ICON_PLAY_SM = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var ICON_PAUSE_SM = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
  var ICON_PLAY_LG = '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var ICON_PAUSE_LG = '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';

  docPre.textContent = DOC_TEXT;

  var tracks = [];
  var currentId = null, isPlaying = false, npOpen = false;
  var currentManifestUrl = '';
  var currentLyrics = [], currentLyricIndex = -1;
  var userScrolling = false, scrollTimer = null;

  var logicalCenter = 0;
  var currentOffset = 0;
  var isAnimatingScroll = false;

  var isDown = false;
  var startX = 0;
  var lastX = 0;
  var moved = false;

  var SOURCE_KEY = 'yaonet_manifest_v3';
  var PLAYER_KEY = 'yaonet_player_state_v1';
  var THEME_KEY = 'yaonet_theme';
  var sourceState = { manifestUrl: '' };

  // ==================== 基础工具 ====================
  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmt(s){
    if (!isFinite(s) || s < 0) return '0:00';
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  function getTrack(id){
    for (var i = 0; i < tracks.length; i++){ if (tracks[i].id === id) return tracks[i]; }
    return null;
  }
  function absoluteUrl(url){
    if (!url) return '';
    try { return new URL(url, location.href).href; } catch(e){ return url; }
  }
  function resolveAsset(url, base){
    if (!url) return '';
    if (/^[a-z][a-z0-9+.-]*:/i.test(url) || url.indexOf('//') === 0) return url;
    try { return new URL(url, base).href; } catch(e){ return url; }
  }
  function looksLikeLRC(s){
    return typeof s === 'string' && /^\s*\[\d{1,3}:\d{1,2}/.test(s);
  }
  function isSameOrigin(url) {
    try { return new URL(url, location.href).origin === location.origin; }
    catch (e) { return true; }
  }
  // 宽屏判断，与 CSS media query 保持一致
  function isWideLayout() {
    return window.innerWidth > 768 || window.innerWidth > window.innerHeight;
  }

  function getStepWidth() {
    var viewportW = window.innerWidth;
    var isMobile = viewportW <= 820;
    var cardW = isMobile ? Math.min(200, viewportW * 0.5) : Math.min(240, viewportW * 0.55);
    var gap = isMobile ? 16 : 24;
    return cardW + gap;
  }

  // ==================== 主题与颜色提取 ====================
  function initTheme() {
    var savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeToggle.checked = true;
    } else if (savedTheme === 'light') {
      document.documentElement.removeAttribute('data-theme');
      themeToggle.checked = false;
    } else {
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (prefersDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.checked = true;
      }
    }
  }
  themeToggle.addEventListener('change', function() {
    if (this.checked) {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem(THEME_KEY, 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem(THEME_KEY, 'light');
    }
    if (currentId) updateTrackColors(getTrack(currentId));
  });

  var spectrumColor = [45, 90, 74], spectrumColorLight = [127, 191, 168];

  function lightenColor(rgb, amount){
    return [Math.min(255, rgb[0] + amount), Math.min(255, rgb[1] + amount), Math.min(255, rgb[2] + amount)];
  }

  function extractColorFromImage(url, callback){
    if (!url) return callback(null);
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){
      try {
        var c = document.createElement('canvas'), size = 40;
        c.width = size; c.height = size;
        var cx = c.getContext('2d'); cx.drawImage(img, 0, 0, size, size);
        var data = cx.getImageData(0, 0, size, size).data;
        var r=0,g=0,b=0,n=0;
        for (var i=0;i<data.length;i+=4){
          var pr=data[i], pg=data[i+1], pb=data[i+2], pa=data[i+3];
          if (pa < 128) continue;
          var mx = Math.max(pr,pg,pb), mn = Math.min(pr,pg,pb);
          if (mx - mn < 25) continue;
          var br = (pr+pg+pb)/3;
          if (br < 25 || br > 235) continue;
          r+=pr; g+=pg; b+=pb; n++;
        }
        if (n === 0) return callback(null);
        callback([Math.round(r/n), Math.round(g/n), Math.round(b/n)]);
      } catch(e){ callback(null); }
    };
    img.onerror = function(){ callback(null); };
    img.src = url;
  }

  function applyColors(r, g, b) {
    spectrumColor = [r, g, b];
    var lightArr = lightenColor([r,g,b], 60);
    spectrumColorLight = lightArr;

    var darkR = Math.floor(r * 0.35), darkG = Math.floor(g * 0.35), darkB = Math.floor(b * 0.35);
    npBackdrop.style.background = `radial-gradient(circle at 50% 10%, rgba(${r},${g},${b}, 0.45) 0%, rgba(${darkR},${darkG},${darkB}, 0.85) 40%, #0f0f0f 90%)`;

    document.documentElement.style.setProperty('--np-primary', `rgb(${r},${g},${b})`);
    document.documentElement.style.setProperty('--np-primary-light', `rgb(${lightArr.join(',')})`);

    npVinylDisc.style.setProperty('--vinyl-label', `rgb(${r},${g},${b})`);
  }

  function updateTrackColors(track) {
    applyColors(45, 90, 74);
    if (!track || !track.cover) return;
    extractColorFromImage(track.cover, function(rgb){
      if (rgb) applyColors(rgb[0], rgb[1], rgb[2]);
    });
  }

  // ==================== 歌词逻辑 ====================
  function parseLRC(text) {
    if (!text) return [];
    var lines = String(text).replace(/\r\n?/g, '\n').split('\n');
    var result = [];
    var timeReg = /\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;

    var hasTimestamp = false;
    for (var k = 0; k < lines.length; k++) {
      if (/\[\d{1,3}:\d{1,2}/.test(lines[k])) { hasTimestamp = true; break; }
    }

    if (!hasTimestamp) {
      for (var t = 0; t < lines.length; t++) {
        var plain = lines[t].trim();
        if (plain) result.push({ time: -1, text: plain });
      }
      return result;
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;

      timeReg.lastIndex = 0;
      var times = [];
      var m;
      while ((m = timeReg.exec(line)) !== null) {
        var min = parseInt(m[1], 10);
        var sec = parseInt(m[2], 10);
        var msStr = m[3] || '0';
        var ms = parseInt(msStr, 10);
        if (msStr.length === 2) ms *= 10;
        else if (msStr.length === 1) ms *= 100;
        times.push(min * 60 + sec + ms / 1000);
      }

      if (times.length) {
        var content = line.replace(/\[[^\]]*\]/g, '').trim();
        if (content) {
          for (var j = 0; j < times.length; j++) {
            result.push({ time: times[j], text: content });
          }
        }
      }
    }

    result.sort(function (a, b) { return a.time - b.time; });
    return result;
  }

  function loadLyrics(track) {
    currentLyrics = []; currentLyricIndex = -1;
    userScrolling = false;
    npLyricsContent.innerHTML = '<div class="lyric-line active">暂无歌词</div>';
    if (!track || !track.lyrics) return;

    var lStr = track.lyrics;

    var isUrl = /^(https?:)?\/\//i.test(lStr)
      || lStr.indexOf('data:') === 0
      || lStr.charAt(0) === '/'
      || /\.lrc(\?|#|$)/i.test(lStr);

    if (!isUrl) {
      renderLyrics(parseLRC(lStr));
    } else {
      fetch(lStr, { cache: 'no-store', credentials: 'omit' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function (text) {
          if (!text || text.indexOf('<html') > -1) throw new Error('返回内容异常');
          if (currentId === track.id) {
            renderLyrics(parseLRC(text));
          }
        })
        .catch(function (e) {
          if (currentId === track.id) {
            npLyricsContent.innerHTML = '<div class="lyric-line active">歌词加载失败：' + esc(e.message) + '</div>';
          }
        });
    }
  }

  function renderLyrics(lyrics) {
    currentLyrics = lyrics; currentLyricIndex = -1;
    npViewLyrics.style.scrollBehavior = 'auto';
    npViewLyrics.scrollTop = 0;

    if (!lyrics.length) {
      npLyricsContent.innerHTML = '<div class="lyric-line active">纯音乐，请欣赏</div>';
      npViewLyrics.style.scrollBehavior = '';
      return;
    }
    npLyricsContent.innerHTML = lyrics.map((l, i) => `<div class="lyric-line" data-index="${i}">${esc(l.text)}</div>`).join('');
    updateLyricsHighlight(audio.currentTime);
    setTimeout(() => { npViewLyrics.style.scrollBehavior = ''; }, 100);
  }

  function updateLyricsHighlight(currentTime) {
    if (!currentLyrics.length || currentLyrics[0].time === -1) return;
    var idx = -1;
    for (var i = 0; i < currentLyrics.length; i++) {
      if (currentTime >= currentLyrics[i].time) idx = i; else break;
    }
    if (idx !== currentLyricIndex) {
      currentLyricIndex = idx;
      var lines = npLyricsContent.querySelectorAll('.lyric-line');
      for (var j = 0; j < lines.length; j++) {
        if (j === idx) lines[j].classList.add('active'); else lines[j].classList.remove('active');
      }
      if (idx >= 0 && lines[idx] && !userScrolling) {
        var top = lines[idx].offsetTop - npViewLyrics.offsetHeight / 2 + lines[idx].offsetHeight / 2;
        npViewLyrics.scrollTop = top;
      }
    }
  }

  npViewLyrics.addEventListener('scroll', function () {
    if (npViewLyrics.style.scrollBehavior === 'auto') return;
    userScrolling = true;
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function () { userScrolling = false; }, 4000);
  }, { passive: true });

  // ==================== 3D Cover Flow ====================
  function initCoverFlow() {
    let html = '';
    for (let i = -4; i <= 4; i++) {
      html += `<div class="cover-card" data-slot="${i}"></div>`;
    }
    coverTrack.innerHTML = html;
    update3D();
  }

  function update3D() {
    const N = tracks.length;
    if (!N) return;

    const stepWidth = getStepWidth();
    let closestSlot = -1;
    let minDist = Infinity;
    const cards = coverTrack.querySelectorAll('.cover-card');

    cards.forEach(card => {
      const i = parseInt(card.getAttribute('data-slot'), 10);

      let realIndex = (logicalCenter + i) % N;
      if (realIndex < 0) realIndex += N;
      const t = tracks[realIndex];

      if (card.getAttribute('data-id') !== t.id) {
        card.setAttribute('data-id', t.id);
        if (t.cover) {
          card.innerHTML = `<img src="${esc(t.cover)}" loading="lazy" decoding="async" onerror="this.style.display='none'">`;
          card.classList.remove('no-cover');
        } else {
          card.innerHTML = '♪';
          card.classList.add('no-cover');
        }
      }

      let step = i - currentOffset;
      let absStep = Math.abs(step);

      if (absStep > 3.5) {
        card.style.opacity = '0';
        card.style.pointerEvents = 'none';
        return;
      }

      let translateX = step * stepWidth;
      let rotateY = step * -55;
      let translateZ = -absStep * 60;
      let scale = 1 - absStep * 0.08;
      let opacity = 1 - absStep * 0.35;

      card.style.transform = `translateX(${translateX}px) translateZ(${translateZ}px) rotateY(${rotateY}deg) scale(${scale})`;
      card.style.opacity = Math.max(0, opacity);
      card.style.zIndex = 100 - Math.floor(absStep * 10);
      card.style.pointerEvents = '';       /* 修复：复位 */

      if (absStep < minDist) {
        minDist = absStep;
        closestSlot = i;
      }
    });

    cards.forEach(c => c.classList.remove('is-centered'));
    if (closestSlot !== -1) {
      const closestCard = coverTrack.querySelector(`.cover-card[data-slot="${closestSlot}"]`);
      if (closestCard) closestCard.classList.add('is-centered');
    }
  }

  function animateToOffset(targetOffset) {
    if (isAnimatingScroll || !tracks.length) return;
    isAnimatingScroll = true;

    const N = tracks.length;
    const startOffset = currentOffset;
    const distance = targetOffset - startOffset;
    const duration = 250;
    const startTime = performance.now();

    function step(now) {
      if (!isAnimatingScroll) return;
      let p = (now - startTime) / duration;
      if (p > 1) p = 1;
      const ease = 1 - Math.pow(1 - p, 3);

      currentOffset = startOffset + distance * ease;
      update3D();

      if (p < 1) {
        requestAnimationFrame(step);
        return;
      }

      currentOffset = targetOffset;

      if (targetOffset !== 0) {
        const shift = Math.floor(targetOffset);
        logicalCenter = ((logicalCenter + shift) % N + N) % N;
        currentOffset -= shift;
      }

      update3D();
      isAnimatingScroll = false;
      syncPlayerToCurrent();      /* 修复：无论如何都同步 */
    }
    requestAnimationFrame(step);
  }

  function syncPlayerToCurrent() {
    const N = tracks.length;
    if (!N) return;
    let t = tracks[logicalCenter];
    if (!t) return;

    if (currentId !== t.id) {
      currentId = t.id;
      audio.src = t.src;
      audio.play().catch(e => console.warn(e));
      updatePlayerUI(t);
      savePlayerState();
    }
  }

  function getClientX(e) {
    return e.touches && e.touches.length ? e.touches[0].clientX : e.clientX;
  }

  function onDown(e) {
    if (e.button && e.button !== 0) return;
    if (isAnimatingScroll) isAnimatingScroll = false;
    isDown = true;
    moved = false;
    startX = getClientX(e);
    lastX = startX;
  }

  function onMove(e) {
    if (!isDown) return;
    if (e.cancelable) e.preventDefault();

    var clientX = getClientX(e);
    var dx = clientX - lastX;
    lastX = clientX;

    if (Math.abs(clientX - startX) > 5) moved = true;

    currentOffset -= dx / getStepWidth();

    var shift = Math.floor(currentOffset);
    if (shift !== 0) {
      logicalCenter = (logicalCenter + shift) % tracks.length;
      if (logicalCenter < 0) logicalCenter += tracks.length;
      currentOffset -= shift;
    }

    update3D();
  }

  function onUp(e) {
    if (!isDown) return;
    isDown = false;

    if (moved) {
      var target = 0;
      if (currentOffset > 0.2) target = 1;
      else if (currentOffset < -0.2) target = -1;

      animateToOffset(target);
    }
  }

  coverStage.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);

  coverStage.addEventListener('touchstart', onDown, { passive: true });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);

  coverTrack.addEventListener('click', (e) => {
    if (moved) return;
    const card = e.target.closest('.cover-card');
    if (card) {
      const slot = parseInt(card.getAttribute('data-slot'), 10);
      if (slot === 0) {
        togglePlay();
      } else {
        animateToOffset(slot);
      }
    }
  });

  // ==================== 数据加载与播放 ====================
  function buildCandidates(rawInput){
    var input = (rawInput || '').trim();
    if (input) return [input];
    var list = ['./manifest.json', '/manifest.json'], seen = {}, out = [];
    for (var i = 0; i < list.length; i++){
      var abs = absoluteUrl(list[i]);
      if (!seen[abs]){ seen[abs] = true; out.push(list[i]); }
    }
    return out;
  }

  function fetchManifest(url){
    return fetch(url, { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(text => {
        var data = JSON.parse(text);
        if (!data || !Array.isArray(data.tracks)) throw new Error('缺少 tracks 数组');
        return data;
      });
  }

  function fetchFirstAvailable(candidates){
    return new Promise((resolve, reject) => {
      var i = 0, errors = [];
      function next(){
        if (i >= candidates.length) return reject(new Error(errors[errors.length - 1] || '未找到清单'));
        var url = candidates[i++];
        fetchManifest(url).then(data => resolve({ url, data })).catch(e => { errors.push(absoluteUrl(url) + '：' + e.message); next(); });
      }
      next();
    });
  }

  function normalizeSongs(rawSongs, baseUrl){
    return rawSongs
      .filter(s => s && typeof s === 'object' && s.src)     /* 修复：过滤无 src */
      .map((s, i) => ({
        id: s.id || ('s' + i), title: s.title || '未命名', artist: s.artist || '',
        album: s.album || '', category: s.category || '未分类',
        src: resolveAsset(s.src, baseUrl), cover: resolveAsset(s.cover, baseUrl),
        lyrics: looksLikeLRC(s.lyrics) ? s.lyrics : resolveAsset(s.lyrics, baseUrl)
      }));
  }

  function refreshLibrary(){
    fetchFirstAvailable(buildCandidates(sourceState.manifestUrl))
      .then(res => {
        currentManifestUrl = res.url;
        tracks = normalizeSongs(res.data.tracks, absoluteUrl(res.url));
        if (!tracks.length) throw new Error('清单中没有可用曲目（缺少 src 字段）');
        logicalCenter = ((logicalCenter % tracks.length) + tracks.length) % tracks.length;

        applyRestoredPlayerState();
        if (!currentId && tracks.length) {
          currentId = tracks[0].id;
          logicalCenter = 0;
          updatePlayerUI(getTrack(currentId));
        }

        initCoverFlow();
      })
      .catch(e => {
        coverTrack.innerHTML = `<div style="color:#ef4444;padding:20px;width:100%;text-align:center;">加载失败: ${esc(e.message)}</div>`;
      });
  }

  function updatePlayerUI(t) {
    if (!t) {
      pbTitle.textContent = '未在播放';
      pbArtist.textContent = '请选择曲目';
      pbCoverImg.style.display = 'none';
      pbCover.classList.remove('has-cover');
      pbCover.style.background = 'var(--border)';
      return;
    }
    pbTitle.textContent = t.title;
    pbArtist.textContent = t.artist || '未知艺术家';
    if (t.cover) {
      pbCoverImg.src = t.cover;
      pbCoverImg.style.display = 'block';
      pbCover.classList.add('has-cover');
      pbCover.style.background = 'transparent';
    } else {
      pbCoverImg.removeAttribute('src');
      pbCoverImg.style.display = 'none';
      pbCover.classList.remove('has-cover');
      pbCover.style.background = 'var(--border)';
    }

    /* 修复：用 <img> 而不是背景图，避免 ♪ 伪元素覆盖在封面之上 */
    if (t.cover) {
      npCover.innerHTML = '<img src="' + esc(t.cover) + '" alt="">';
      npVinylDisc.style.setProperty('--vinyl-label', 'url("' + t.cover + '")');
    } else {
      npCover.innerHTML = '';
      npVinylDisc.style.setProperty('--vinyl-label', 'var(--np-primary)');
    }
    npTitle.textContent = t.title;
    npArtist.textContent = (t.artist || '') + (t.album ? ' · ' + t.album : '');

    updateTrackColors(t);
    loadLyrics(t);
  }

  function togglePlay() {
    if (!currentId) {
      if (tracks.length) {
        logicalCenter = 0;
        update3D();
        syncPlayerToCurrent();
      }
      return;
    }
    if (audio.paused) { ensureAudioContext(); audio.play().catch(e => console.warn(e)); }
    else { audio.pause(); }
  }

  function nextTrack() {
    if (!tracks.length) return;
    animateToOffset(1);
  }

  function prevTrack() {
    if (!tracks.length) return;
    animateToOffset(-1);
  }

  function updateProgress() {
    var d = audio.duration, c = audio.currentTime;
    if (isFinite(d) && d > 0) {
      seekFill.style.width = (c / d * 100) + '%';
      npFill.style.width = (c / d * 100) + '%';
    }
    curTimeEl.textContent = fmt(c); npCur.textContent = fmt(c);
    if (isFinite(d)) { durTimeEl.textContent = fmt(d); npDur.textContent = fmt(d); }
    updateLyricsHighlight(c);
  }

  function syncPlayUI() {
    btnPlay.innerHTML = isPlaying ? ICON_PAUSE_SM : ICON_PLAY_SM;
    npPlayBtn.innerHTML = isPlaying ? ICON_PAUSE_LG : ICON_PLAY_LG;
    npModal.classList.toggle('is-playing', isPlaying);
  }

  // ==================== 持久化与音频 ====================
  function savePlayerState() {
    try { localStorage.setItem(PLAYER_KEY, JSON.stringify({ trackId: currentId || null, currentTime: audio.currentTime || 0 })); } catch(e){}
  }

  function applyRestoredPlayerState() {
    try {
      var raw = localStorage.getItem(PLAYER_KEY);
      if (!raw) return;
      var state = JSON.parse(raw);
      if (state.trackId) {
        var t = getTrack(state.trackId);
        if (t) {
          currentId = t.id;
          logicalCenter = tracks.findIndex(x => x.id === t.id);
          if (logicalCenter === -1) logicalCenter = 0;
          updatePlayerUI(t);
          audio.src = t.src;
          var seekTo = state.currentTime || 0;
          audio.addEventListener('loadedmetadata', function onMeta(){
            audio.removeEventListener('loadedmetadata', onMeta);
            if (seekTo > 0 && seekTo < audio.duration) audio.currentTime = seekTo;
          });
        }
      }
    } catch(e){}
  }

  // ==================== 频谱动画 ====================
  var audioCtx = null, analyser = null, freqData = null;
  var barSpectrumCanvas = document.getElementById('bar-spectrum'), barSpectrumCtx = barSpectrumCanvas.getContext('2d');
  var npSpectrumCanvas = document.getElementById('np-spectrum'), npSpectrumCtx = npSpectrumCanvas.getContext('2d');
  var spectrumRAF = null;

  var visData = new Float32Array(64);
  var targetData = new Float32Array(64);
  var isSpectrumRunning = false;
  var lastSpectrumTime = 0;

  function setupAnalyser() {
    if (audioCtx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    /* 修复：跨域音频接入分析器会被强制静音，因此跳过 */
    if (!audio.src || !isSameOrigin(audio.src)) return;
    try {
      audioCtx = new AC();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      var sourceNode = audioCtx.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      freqData = new Uint8Array(analyser.frequencyBinCount);
    } catch(e){ audioCtx = null; analyser = null; }
  }

  function ensureAudioContext() {
    if (!audioCtx) setupAnalyser();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function generateFakeData(t){
    var arr = new Uint8Array(64);
    for (var i=0;i<64;i++){
      var v = Math.sin(t*0.003 + i*0.2) * Math.cos(t*0.001 - i*0.1);
      arr[i] = Math.floor((v + 1) / 2 * 255);
    }
    return arr;
  }

  function drawSpectrum(canvas, ctx, data, isFullScreen) {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    var cw = Math.round(w * dpr), ch = Math.round(h * dpr);
    if (canvas.width !== cw || canvas.height !== ch) {
      canvas.width = cw;
      canvas.height = ch;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var usable = data.length;

    var targetBarW = isFullScreen ? 8 : 6;
    var bars = Math.floor(w / targetBarW);
    if (bars <= 0) return;

    var actualBarW = w / bars;
    var gap = Math.max(1, actualBarW * 0.25);
    var bw = actualBarW - gap;

    var grad = ctx.createLinearGradient(0, h, 0, 0);
    grad.addColorStop(0, `rgba(${spectrumColor.join(',')}, 0.65)`);
    grad.addColorStop(1, `rgba(${spectrumColorLight.join(',')}, 0.25)`);
    ctx.fillStyle = grad;

    for (var i=0; i<bars; i++){
      var startIdx = Math.floor((i / bars) * usable);
      var endIdx = Math.floor(((i + 1) / bars) * usable);
      if (endIdx <= startIdx) endIdx = startIdx + 1;

      var sum = 0, cnt = 0;
      for (var j = startIdx; j < endIdx && j < usable; j++) {
        sum += data[j];
        cnt++;
      }
      var v = cnt ? sum / cnt / 255 : 0;
      v = Math.pow(v, 0.35);

      var bh = v > 0.01 ? Math.max(2, v * h * 1.25) : 0;
      if (bh > 0) {
        ctx.fillRect(i * actualBarW + gap/2, h - bh, bw, bh);
      }
    }
  }

  function loopSpectrum(now) {
    if (!isSpectrumRunning) return;

    if (!lastSpectrumTime) lastSpectrumTime = now;
    var dt = Math.min(now - lastSpectrumTime, 50);
    lastSpectrumTime = now;

    if (isPlaying) {
      if (analyser && freqData) {
        analyser.getByteFrequencyData(freqData);
        var sum = freqData.reduce((a,b)=>a+b, 0);
        if (sum > 100) {
          for (var i = 0; i < 64; i++) {
            var idx = Math.floor(i * (freqData.length / 64));
            targetData[i] = freqData[idx];
          }
        } else {
          var fake = generateFakeData(Date.now());
          for(var k=0; k<64; k++) targetData[k] = fake[k];
        }
      } else {
        var fake = generateFakeData(Date.now());
        for(var k=0; k<64; k++) targetData[k] = fake[k];
      }
    } else {
      targetData.fill(0);
    }

    /* 基于时间差的平滑：60/120Hz 屏幕衰减一致 */
    var baseEase = isPlaying ? 0.35 : 0.08;
    var ease = 1 - Math.pow(1 - baseEase, dt / 16.66);

    var isAllZero = true;
    for (var m = 0; m < 64; m++) {
      visData[m] += (targetData[m] - visData[m]) * ease;
      if (visData[m] > 1) isAllZero = false;
      else visData[m] = 0;
    }

    if (npOpen) drawSpectrum(npSpectrumCanvas, npSpectrumCtx, visData, true);
    else drawSpectrum(barSpectrumCanvas, barSpectrumCtx, visData, false);

    if (isPlaying || !isAllZero) {
      spectrumRAF = requestAnimationFrame(loopSpectrum);
    } else {
      isSpectrumRunning = false;
      spectrumRAF = null;
    }
  }

  function startSpectrum() {
    if (isSpectrumRunning) return;
    isSpectrumRunning = true;
    lastSpectrumTime = 0;
    spectrumRAF = requestAnimationFrame(loopSpectrum);
  }

  // ==================== UI 历史状态管理 ====================
  var historyState = 'main';

  function applyNPInitialView() {
    if (isWideLayout()) {
      /* 宽屏：封面 + 歌词双栏并显 */
      npViewCover.classList.remove('hidden');
      npViewLyrics.classList.remove('hidden');
      void npViewLyrics.offsetWidth;
      npViewLyrics.classList.add('active');
      npToggleLyricsBtn.classList.remove('active');
    } else {
      /* 竖屏：只显示封面 */
      npViewCover.classList.remove('hidden');
      npViewLyrics.classList.add('hidden');
      npViewLyrics.classList.remove('active');
      npToggleLyricsBtn.classList.remove('active');
    }
  }

  function openNP() {
    if (!currentId || npOpen) return;
    npOpen = true;
    npModal.hidden = false;
    npModal.classList.remove('closing');
    document.body.style.overflow = 'hidden';

    applyNPInitialView();

    if (historyState !== 'np') {
      history.pushState({ modal: 'np' }, '');
      historyState = 'np';
    }

    if (isPlaying || isSpectrumRunning) startSpectrum();
    else drawSpectrum(npSpectrumCanvas, npSpectrumCtx, visData, true);
  }

  function closeNP(fromPopstate) {
    if (!npOpen) return;
    npOpen = false;
    npModal.classList.add('closing');
    setTimeout(() => {
      npModal.hidden = true;
      npModal.classList.remove('closing');
      document.body.style.overflow = '';
    }, 200);

    if (!fromPopstate) {
      if (history.state && history.state.modal === 'np') history.back();
    } else {
      historyState = 'main';
    }
  }

  function openSettings() {
    if (!settingsModal.hidden) return;
    settingsModal.hidden = false;
    settingsStatus.textContent = '';
    updateManifestHints();

    if (historyState !== 'settings') {
      history.pushState({ modal: 'settings' }, '');
      historyState = 'settings';
    }
  }

  function closeSettings(fromPopstate) {
    if (settingsModal.hidden) return;
    settingsModal.hidden = true;

    if (!fromPopstate) {
      if (history.state && history.state.modal === 'settings') history.back();
    } else {
      historyState = 'main';
    }
  }

  window.addEventListener('popstate', function() {
    historyState = 'main';
    if (npOpen) closeNP(true);
    if (!settingsModal.hidden) closeSettings(true);
  });

  // ==================== 全局事件 ====================
  audio.addEventListener('play', () => { isPlaying = true; ensureAudioContext(); syncPlayUI(); startSpectrum(); });
  audio.addEventListener('pause', () => { isPlaying = false; syncPlayUI(); savePlayerState(); startSpectrum(); });
  audio.addEventListener('ended', nextTrack);
  audio.addEventListener('timeupdate', updateProgress);

  btnPlay.addEventListener('click', togglePlay);
  btnPrev.addEventListener('click', prevTrack);
  btnNext.addEventListener('click', nextTrack);
  npPlayBtn.addEventListener('click', togglePlay);
  npPrevBtn.addEventListener('click', prevTrack);
  npNextBtn.addEventListener('click', nextTrack);

  npToggleLyricsBtn.addEventListener('click', () => {
    if (isWideLayout()) return;     /* 宽屏下按钮隐藏，无需处理 */
    if (npViewCover.classList.contains('hidden')) {
      npViewLyrics.classList.remove('active');
      setTimeout(() => npViewLyrics.classList.add('hidden'), 300);
      npViewCover.classList.remove('hidden');
      npToggleLyricsBtn.classList.remove('active');
    } else {
      npViewCover.classList.add('hidden');
      npViewLyrics.classList.remove('hidden');
      void npViewLyrics.offsetWidth;
      npViewLyrics.classList.add('active');
      npToggleLyricsBtn.classList.add('active');
      if (isPlaying || currentLyricIndex !== -1) updateLyricsHighlight(audio.currentTime);
    }
  });

  function bindSeek(barEl) {
    function seek(e) {
      var rect = barEl.getBoundingClientRect();
      var ratio = Math.max(0, Math.min(1, (getClientX(e) - rect.left) / rect.width));
      if (isFinite(audio.duration)) audio.currentTime = ratio * audio.duration;
    }
    var dragging = false;
    barEl.addEventListener('mousedown', function(e){ dragging = true; seek(e); e.preventDefault(); });
    window.addEventListener('mousemove', function(e){ if (dragging) seek(e); });
    window.addEventListener('mouseup', function(){ dragging = false; });
    barEl.addEventListener('touchstart', function(e){ dragging = true; seek(e); }, { passive: true });
    barEl.addEventListener('touchmove', function(e){ if (dragging) { seek(e); e.preventDefault(); } }, { passive: false });
    barEl.addEventListener('touchend', function(){ dragging = false; });
  }
  bindSeek(seekBar);
  bindSeek(npBar);

  pbCover.addEventListener('click', openNP);

  npModal.addEventListener('click', e => {
    if (e.target.closest('[data-np-close]')) closeNP(false);
  });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape') {
      if (npOpen) closeNP(false);
      else if (!settingsModal.hidden) closeSettings(false);
      return;
    }
    if (e.target.closest('button')) return;
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    if (e.key === 'ArrowRight' && !npOpen) nextTrack();
    if (e.key === 'ArrowLeft' && !npOpen) prevTrack();
  });

  function updateManifestHints(){
    var raw = (sourceState.manifestUrl || '').trim();
    var resolved = raw ? absoluteUrl(raw) : absoluteUrl('./manifest.json');
    settingsCurrent.innerHTML = '<strong>当前生效地址</strong>' + esc(resolved);
  }

  settingsBtn.addEventListener('click', openSettings);
  settingsModal.addEventListener('click', e => { if(e.target.closest('[data-settings-close]')) closeSettings(false); });

  settingsTabs.addEventListener('click', e => {
    var btn = e.target.closest('.settings-tab'); if(!btn) return;
    var name = btn.getAttribute('data-tab');
    settingsModal.querySelectorAll('.settings-tab').forEach(b => b.classList.toggle('active', b === btn));
    settingsModal.querySelectorAll('.settings-tab-content').forEach(c => c.hidden = c.getAttribute('data-content') !== name);
  });

  pfSave.addEventListener('click', () => {
    sourceState.manifestUrl = manifestUrlEl.value.trim();
    try { localStorage.setItem(SOURCE_KEY, JSON.stringify(sourceState)); } catch(e){}
    settingsStatus.textContent = '已保存';
    closeSettings(false);
    refreshLibrary();
  });

  window.addEventListener('resize', () => {
    /* 宽/窄布局切换：NP 打开时根据当前布局刷新视图 */
    if (npOpen) {
      if (isWideLayout()) {
        npViewCover.classList.remove('hidden');
        npViewLyrics.classList.remove('hidden');
        npViewLyrics.classList.add('active');
        npToggleLyricsBtn.classList.remove('active');
      } else {
        /* 窄屏：用户此前未主动打开歌词则恢复封面视图 */
        if (!npToggleLyricsBtn.classList.contains('active')) {
          npViewCover.classList.remove('hidden');
          npViewLyrics.classList.add('hidden');
          npViewLyrics.classList.remove('active');
        }
      }
    }
    update3D();
    drawSpectrum(npSpectrumCanvas, npSpectrumCtx, visData, true);
    drawSpectrum(barSpectrumCanvas, barSpectrumCtx, visData, false);
  });

  initTheme();
  try {
    var raw = localStorage.getItem(SOURCE_KEY);
    if (raw) sourceState = JSON.parse(raw);
  } catch(e){}
  manifestUrlEl.value = sourceState.manifestUrl || '';

  refreshLibrary();
})();
</script>
</body>
</html>
