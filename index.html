<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAONET · 音频播放器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3;--surface:#fff;--text:#1a1a1a;--text-2:#5f5f5f;--text-3:#8a8a8a;
    --border:rgba(0,0,0,.07);--accent:#2d5a4a;--accent-soft:#e8efec;
    --radius-lg:18px;--radius-md:14px;--radius-sm:10px;
    --font:'Manrope',system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);--shadow-md:0 8px 30px rgba(0,0,0,.06);
    --max-width:1200px;--header-h:64px;--subnav-h:52px;--player-h:92px;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f0f0f;--surface:#1a1a1a;--text:#f0f0f0;--text-2:#a0a0a0;--text-3:#6e6e6e;
      --border:rgba(255,255,255,.08);--accent:#7fbfa8;--accent-soft:#1f2e29;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 8px 30px rgba(0,0,0,.4);}
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:var(--font)}
  .container{max-width:var(--max-width);margin:0 auto;padding:0 24px}

  /* 基础页面样式（主界面） */
  .site-header{position:sticky;top:0;z-index:100;backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--border)}
  .header-inner{display:flex;align-items:center;justify-content:space-between;height:var(--header-h)}
  .site-brand{font-size:1.32rem;font-weight:800;letter-spacing:-.03em;display:inline-flex;align-items:baseline}
  .site-brand span{color:var(--accent)}
  .header-right{display:flex;align-items:center;gap:14px}
  .live-badge{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:600;color:var(--text-2);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15);animation:pulse 2s infinite;flex-shrink:0}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .settings-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s,transform .15s;flex-shrink:0}
  .settings-btn:hover{background:var(--surface);color:var(--text);transform:rotate(18deg)}
  .settings-btn:active{transform:scale(.94)}

  .subnav{position:sticky;top:var(--header-h);z-index:90;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid var(--border)}
  .subnav-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:var(--subnav-h)}
  .cat-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .cat-tabs::-webkit-scrollbar{display:none}
  .cat-tab{flex-shrink:0;font-size:.86rem;font-weight:600;padding:7px 15px;border-radius:999px;color:var(--text-2);border:none;background:transparent;cursor:pointer;transition:all .18s;white-space:nowrap}
  .cat-tab:hover{color:var(--text);background:var(--surface)}
  .cat-tab.active{background:var(--accent);color:#fff}
  .subnav-meta{font-size:.76rem;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}

  .audio-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;padding-top:26px;padding-bottom:64px;align-items:start;animation:fadeUp .5s ease both}
  .main-col{min-width:0}

  .hero{display:flex;gap:26px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px 30px;box-shadow:var(--shadow-sm);margin-bottom:22px;transition:box-shadow .2s,border-color .2s}
  .hero:hover{box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--accent) 22%,var(--border))}
  .hero-cover{width:158px;height:158px;border-radius:16px;flex-shrink:0;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(45,90,74,.22);display:grid;place-items:center}
  .hero-cover::before{content:'♪';color:rgba(255,255,255,.9);font-size:2.6rem;line-height:1;transform:translateY(-2px);position:absolute}
  .hero-cover img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
  .hero-body{min-width:0;flex:1}
  .hero-meta{display:flex;align-items:center;gap:10px;font-size:.76rem;color:var(--text-3);margin-bottom:11px;flex-wrap:wrap}
  .hero h2{font-size:clamp(1.4rem,2.6vw,1.85rem);font-weight:800;letter-spacing:-.03em;line-height:1.25;margin-bottom:8px}
  .hero p{font-size:.9rem;color:var(--text-2);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:16px}
  .hero-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hero-status{font-size:.78rem;color:var(--text-3);font-variant-numeric:tabular-nums}

  .track-list{display:flex;flex-direction:column;gap:2px}
  .track-item{display:flex;align-items:center;gap:16px;padding:12px 14px;border-radius:var(--radius-md);border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;width:100%;color:inherit;transition:background .18s,border-color .18s}
  .track-item:hover{background:color-mix(in srgb,var(--accent) 5%,transparent);border-color:var(--border)}
  .track-item.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,transparent)}
  .track-cover{width:50px;height:50px;border-radius:11px;flex-shrink:0;position:relative;overflow:hidden;display:grid;place-items:center;box-shadow:var(--shadow-sm)}
  .track-cover::before{content:'♪';color:rgba(255,255,255,.85);font-size:1.15rem;line-height:1;transform:translateY(-1px);position:absolute}
  .track-cover img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
  .track-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
  .track-title{font-size:.95rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
  .track-meta{font-size:.78rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{font-size:.64rem;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);line-height:1.6;white-space:nowrap;flex-shrink:0}
  .eq{display:inline-flex;align-items:flex-end;gap:2px;height:16px;width:16px;flex-shrink:0}
  .eq i{display:block;width:3px;border-radius:2px;background:var(--accent);animation:eq 1s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.2s}
  .eq i:nth-child(3){animation-delay:.4s}
  .track-item:not(.playing) .eq i{animation-play-state:paused;opacity:.45}
  @keyframes eq{0%,100%{height:4px}50%{height:14px}}

  .sidebar{display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(var(--header-h) + var(--subnav-h) + 16px)}
  .side-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px 22px;box-shadow:var(--shadow-sm)}
  .side-card h3{font-size:.88rem;font-weight:700;letter-spacing:.02em;margin-bottom:14px;color:var(--text)}
  .about-text{font-size:.82rem;color:var(--text-2);line-height:1.7}
  .about-text code{background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:5px;font-size:.85em;font-family:var(--mono)}
  .rank-list{display:flex;flex-direction:column;gap:1px}
  .rank-item{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:.86rem;background:none;border:none;cursor:pointer;text-align:left;width:100%;color:inherit;transition:color .2s}
  .rank-num{width:20px;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums;flex-shrink:0;font-size:.82rem}
  .rank-item:nth-child(-n+3) .rank-num{color:var(--accent)}
  .rank-name{flex:1;color:var(--text-2);transition:color .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rank-item:hover .rank-name{color:var(--accent)}
  .rank-count{font-size:.74rem;color:var(--text-3);font-variant-numeric:tabular-nums;flex-shrink:0}
  .source-list{display:flex;flex-direction:column;gap:1px}
  .source-row{display:flex;justify-content:space-between;align-items:center;font-size:.83rem;padding:6px 0;color:var(--text-2)}
  .source-row span:last-child{color:var(--text-3);font-size:.74rem;font-variant-numeric:tabular-nums}
  .current-manifest{font-size:.78rem;color:var(--text-3);word-break:break-all;line-height:1.6}
  .current-manifest strong{color:var(--text-2);font-weight:600}

  /* ==================== 底部播放条 ==================== */
  .player-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:150;
    background:color-mix(in srgb,var(--surface) 94%,transparent);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border-top:1px solid var(--border);
    box-shadow:0 -8px 30px rgba(0,0,0,.06);
    overflow:hidden;
  }
  .bar-spectrum{
    display:block;position:absolute;left:0;right:0;bottom:0;width:100%;height:56px;
    pointer-events:none;z-index:0;
    -webkit-mask-image:linear-gradient(to top, black 35%, transparent 100%);
    mask-image:linear-gradient(to top, black 35%, transparent 100%);
  }
  .player-inner{
    position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) minmax(0,1fr);
    align-items:center;gap:24px;height:var(--player-h);
  }
  .pb-track{display:flex;align-items:center;gap:12px;min-width:0}
  .pb-cover{width:52px;height:52px;border-radius:11px;flex-shrink:0;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);background:var(--accent-soft);display:grid;place-items:center;cursor:pointer;transition:transform .18s,box-shadow .18s}
  .pb-cover:hover{transform:scale(1.07);box-shadow:var(--shadow-md)}
  .pb-cover:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .pb-cover::before{content:'♪';color:rgba(255,255,255,.9);font-size:1.25rem;line-height:1;transform:translateY(-1px);position:absolute}
  .pb-cover img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
  .pb-info{min-width:0}
  .pb-title{font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pb-artist{font-size:.76rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pb-center{display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
  .pb-controls{display:flex;align-items:center;gap:8px}
  .pb-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;color:var(--text-2);display:grid;place-items:center;cursor:pointer;transition:background .18s,color .18s,transform .12s}
  .pb-btn:hover{background:var(--accent-soft);color:var(--accent)}
  .pb-btn:active{transform:scale(.94)}
  .pb-btn.on{color:var(--accent);background:var(--accent-soft)}
  .pb-play{width:44px;height:44px;background:var(--accent);color:#fff}
  .pb-play:hover{background:var(--accent);color:#fff;opacity:.9}
  .pb-progress{display:flex;align-items:center;gap:10px;width:100%;font-size:.72rem;color:var(--text-3);font-variant-numeric:tabular-nums}
  .pb-bar{flex:1;height:5px;border-radius:999px;background:var(--accent-soft);position:relative;cursor:pointer}
  .pb-bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:999px;background:var(--accent);width:0%;transition:width .12s linear}
  .pb-right{display:flex;align-items:center;justify-content:flex-end;gap:10px}
  .pb-vol{display:flex;align-items:center;gap:8px;color:var(--text-3)}
  .pb-vol input{width:88px;accent-color:var(--accent);cursor:pointer}

  /* ==================== 全屏 Now Playing ==================== */
  .now-playing{position:fixed;inset:0;z-index:300;overflow:hidden;background:#0f0f0f}
  .now-playing[hidden]{display:none}
  .np-backdrop{
    position:absolute;inset:0;
    background:#0f0f0f; /* 默认背景，JS 会动态覆盖 */
    transition:background .8s ease;
    animation:npFade .4s ease both;
  }
  @keyframes npFade{from{opacity:0}to{opacity:1}}
  .np-close{
    position:absolute;top:22px;right:24px;z-index:5;
    width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.1);
    color:rgba(255,255,255,.8);cursor:pointer;
    display:grid;place-items:center;
    transition:background .2s,color .2s,transform .15s;
    backdrop-filter:blur(4px);
  }
  .np-close:hover{background:rgba(255,255,255,.2);color:#fff;transform:scale(1.05)}

  /* 频谱：强制 100% 宽度，贴屏幕底部 */
  .np-spectrum{
    display:block;position:absolute;left:0;right:0;bottom:0;width:100%;height:160px;
    pointer-events:none;z-index:1;
    -webkit-mask-image:linear-gradient(to top, black 20%, transparent 100%);
    mask-image:linear-gradient(to top, black 20%, transparent 100%);
  }

  .np-content{
    position:absolute;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;
    padding-bottom:160px; /* 为底部频谱留出空间 */
    pointer-events:none; /* 让点击穿透到背景 */
  }

  .np-inner{
    display:flex;flex-direction:column;align-items:center;
    gap:16px;
    width:100%;max-width:720px;max-height:100%;
    pointer-events:auto; /* 内部元素可点击 */
  }

  .np-art{display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
  .np-cover{
    width:min(280px,50vw);height:min(280px,50vw);
    border-radius:min(20px,4vw);
    position:relative;z-index:2;
    box-shadow:0 30px 80px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.2);
    display:grid;place-items:center;
    background:var(--accent-soft);
    will-change:transform;
    overflow:hidden;
  }
  .np-cover::before{content:'♪';color:rgba(255,255,255,.9);font-size:clamp(2.4rem,7vw,3.6rem);line-height:1;transform:translateY(-4%);position:absolute}
  .np-cover img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}

  .np-vinyl{
    width:min(260px,48vw);height:min(260px,48vw);
    margin-left:calc(min(260px,48vw) * -0.5);
    position:relative;z-index:1;
    animation:vinylIn .55s cubic-bezier(.22,1,.36,1) .08s both;
  }
  @keyframes vinylIn{from{transform:translateX(-45%) scale(.84) rotate(-18deg);opacity:0}to{transform:translateX(0) scale(1) rotate(0);opacity:1}}
  .np-vinyl-disc{
    width:100%;height:100%;border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%,rgba(255,255,255,.10),transparent 46%),
      repeating-radial-gradient(circle at center,#1d1d1d 0 1px,#0d0d0d 1px 3px);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 28px 70px rgba(0,0,0,.5);
    position:relative;
    animation:spin 10s linear infinite;
    animation-play-state:paused;
  }
  .now-playing.is-playing .np-vinyl-disc{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}
  .np-vinyl-disc::before{content:'';position:absolute;width:37%;height:37%;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--vinyl-label,var(--accent));box-shadow:inset 0 0 0 1px rgba(0,0,0,.22),0 2px 10px rgba(0,0,0,.3)}
  .np-vinyl-disc::after{content:'';position:absolute;width:7%;height:7%;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);background:#0a0a0a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}

  .np-info{text-align:center;max-width:100%;padding:0 12px;flex-shrink:0}
  .np-info h2{
    font-size:clamp(1.3rem,3vw,1.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.2;
    margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;
  }
  .np-info p{font-size:.85rem;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 沉浸式歌词区 */
  .np-lyrics{
    width:100%;max-width:480px;height:110px;
    overflow-y:auto;overflow-x:hidden;
    scrollbar-width:none;-ms-overflow-style:none;
    text-align:center;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    scroll-behavior:smooth;
    padding:0 12px;flex-shrink:0;
  }
  .np-lyrics::-webkit-scrollbar{display:none}
  .np-lyric-line{
    font-size:.95rem;line-height:2.2;color:rgba(255,255,255,.4);
    padding:2px 0;transition:all .3s cubic-bezier(0.25, 1, 0.5, 1);
    transform-origin:center;
  }
  .np-lyric-line.active{
    color:#fff;font-weight:700;transform:scale(1.06);
    text-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  .np-lyrics-empty{text-align:center;color:rgba(255,255,255,.3);font-size:.85rem;padding-top:36px;}

  .np-controls{display:flex;align-items:center;gap:24px;flex-shrink:0;margin-top:4px}
  .np-btn{
    width:52px;height:52px;border-radius:50%;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.08);
    color:rgba(255,255,255,.8);cursor:pointer;
    display:grid;place-items:center;
    transition:all .2s;backdrop-filter:blur(4px);
  }
  .np-btn:hover{background:rgba(255,255,255,.2);color:#fff;transform:scale(1.05)}
  .np-btn:active{transform:scale(.94)}
  .np-btn.np-main{
    width:64px;height:64px;
    background:#fff;color:#1a1a1a;border-color:transparent;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  .np-btn.np-main:hover{background:#f0f0f0;transform:scale(1.05);color:#1a1a1a}

  .now-playing.closing .np-inner,
  .now-playing.closing .np-spectrum,
  .now-playing.closing .np-close,
  .now-playing.closing .np-backdrop{opacity:0;transition:opacity .2s ease}

  /* ==================== 设置弹窗 ==================== */
  .settings-modal{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:24px}
  .settings-modal[hidden]{display:none}
  .settings-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fadeIn .2s ease}
  .settings-panel{position:relative;width:min(600px,100%);max-height:calc(100vh - 48px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow-md);animation:modalIn .25s ease}
  .settings-close{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--text-3);font-size:1.4rem;line-height:1;cursor:pointer;transition:all .2s}
  .settings-close:hover{background:var(--accent-soft);color:var(--text)}
  .settings-panel h3{font-size:1.15rem;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
  .settings-sub{font-size:.82rem;color:var(--text-2);line-height:1.6;margin-bottom:18px}

  .settings-tabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--border)}
  .settings-tab{padding:8px 14px;border:none;background:none;color:var(--text-2);font-size:.84rem;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s;letter-spacing:.01em}
  .settings-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .settings-tab:hover{color:var(--text)}

  .settings-label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px}
  .settings-input{width:100%;font-family:var(--font);font-size:.84rem;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none;transition:border-color .2s}
  .settings-input:focus{border-color:var(--accent)}
  .settings-hint{font-size:.74rem;color:var(--text-3);margin-top:6px;line-height:1.5}
  .settings-hint code{background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:4px;font-size:.9em;font-family:var(--mono)}

  @media (max-width:1024px){

</style>

<script>
(function(){
  'use strict';

  var PALETTES = [
    ['#2d5a4a','#7fbfa8'],
    ['#4a3f5e','#9b8ec4'],
    ['#5e3f3a','#c49b8e'],
    ['#3a4a5e','#8ea9c4'],
    ['#5e4a3a','#c4ab8e'],
    ['#3a5e4a','#8ec4a9']
  ];

  var DOC_TEXT = [
    'manifest.json 数据格式',
    '──────────────────────────────────────────────',
    '',
    '播放器读取一个 JSON 文件来加载曲目列表。文件结构如下：',
    '',
    '{',
    '  "tracks": [',
    '    {',
    '      "id": "唯一标识",',
    '      "title": "曲目标题",',
    '      "artist": "艺术家",',
    '      "album": "专辑",',
    '      "category": "分类",',
    '      "duration": 240,',
    '      "src": "audio/001.mp3",',
    '      "cover": "audio/001.jpg",',
    '      "lyrics": "audio/001.lrc"',
    '    }',
    '  ]',
    '}',
    '',
    '',
    '路径与歌词说明',
    '──────────────────────────────────────────────',
    '',
    'src、cover、lyrics 的路径基于清单文件地址解析。',
    '',
    'lyrics 字段支持三种形式：',
    '  1. 完整 URL 或相对路径，播放器会拉取该文件内容；',
    '  2. 内联的 LRC 文本（例如包含 [00:12.34] 标记）；',
    '  3. 纯文本，播放器会按行切分显示。',
    '',
    '',
    '音频文件要求',
    '──────────────────────────────────────────────',
    '',
    '  · Content-Type 正确，如 audio/mpeg。',
    '',
    '  · 支持 Range 请求。'
  ].join('\n');

  var listEl    = document.getElementById('list');
  var heroEl    = document.getElementById('hero');
  var tabsEl    = document.getElementById('tabs');
  var metaEl    = document.getElementById('meta');
  var rankEl    = document.getElementById('rank-list');
  var sourceEl  = document.getElementById('source-list');
  var currentManifestEl = document.getElementById('current-manifest');
  var liveText  = document.getElementById('live-text');

  var audio     = document.getElementById('player');
  var playerBar = document.getElementById('player-bar');
  var pbCover   = document.getElementById('pb-cover');
  var pbTitle   = document.getElementById('pb-title');
  var pbArtist  = document.getElementById('pb-artist');
  var btnPlay   = document.getElementById('btn-play');
  var btnPrev   = document.getElementById('btn-prev');
  var btnNext   = document.getElementById('btn-next');
  var btnShuffle= document.getElementById('btn-shuffle');
  var seekBar   = document.getElementById('seek-bar');
  var seekFill  = document.getElementById('seek-fill');
  var curTimeEl = document.getElementById('cur-time');
  var durTimeEl = document.getElementById('dur-time');
  var volEl     = document.getElementById('vol');

  var npModal     = document.getElementById('now-playing');
  var npBackdrop  = document.querySelector('.np-backdrop');
  var npCover     = document.getElementById('np-cover');
  var npVinylDisc = document.getElementById('np-vinyl-disc');
  var npTitle     = document.getElementById('np-title');
  var npArtist    = document.getElementById('np-artist');
  var npLyricsEl  = document.getElementById('np-lyrics');
  var npPlayBtn   = document.getElementById('np-play');
  var npPrevBtn   = document.getElementById('np-prev');
  var npNextBtn   = document.getElementById('np-next');

  var settingsBtn   = document.getElementById('settings-btn');
  var settingsModal = document.getElementById('settings-modal');
  var settingsTabs  = document.getElementById('settings-tabs');
  var settingsStatus= document.getElementById('settings-status');
  var settingsCurrent = document.getElementById('settings-current');
  var manifestUrlEl = document.getElementById('manifest-url');
  var pfTest        = document.getElementById('pf-test');
  var pfSave        = document.getElementById('pf-save');
  var docPre        = document.getElementById('doc-pre');
  var footerSettingsLink = document.getElementById('footer-settings-link');

  var ICON_PLAY  = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
  var ICON_PLAY_L  = '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var ICON_PAUSE_L = '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';

  docPre.textContent = DOC_TEXT;

  var tracks = [], filtered = [], activeCat = '全部';
  var currentId = null, isPlaying = false, shuffleOn = false, npOpen = false;
  var currentManifestUrl = '';
  var currentLyrics = [];
  var currentLyricIndex = -1;

  var SOURCE_KEY = 'yaonet_manifest_v3';
  var PLAYER_KEY = 'yaonet_player_state_v1';

  var sourceState = { manifestUrl: '' };

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmt(s){
    if (!isFinite(s) || s < 0) return '0:00';
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  function coverGradient(id){
    var i = 0;
    for (var k = 0; k < tracks.length; k++){ if (tracks[k].id === id){ i = k; break; } }
    var p = PALETTES[i % PALETTES.length];
    return 'linear-gradient(135deg,' + p[0] + ',' + p[1] + ')';
  }
  function getTrack(id){
    for (var i = 0; i < tracks.length; i++){ if (tracks[i].id === id) return tracks[i]; }
    return null;
  }
  function indexInFiltered(id){
    for (var i = 0; i < filtered.length; i++){ if (filtered[i].id === id) return i; }
    return -1;
  }

  function absoluteUrl(url){
    if (!url) return '';
    try { return new URL(url, location.href).href; }
    catch(e){ return url; }
  }

  function resolveAsset(url, base){
    if (!url) return '';
    if (/^[a-z][a-z0-9+.-]*:/i.test(url) || url.indexOf('//') === 0) return url;
    try { return new URL(url, base).href; }
    catch(e){ return url; }
  }

  function isSameOriginUrl(url){
    if (!url) return true;
    try { return new URL(url, location.href).origin === location.origin; }
    catch(e){ return false; }
  }

  // ==================== 歌词逻辑 ====================

  function parseLRC(text) {
    var lines = text.split('\n');
    var result = [];
    var timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
    
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      
      var match = timeReg.exec(line);
      if (match) {
        var min = parseInt(match[1], 10);
        var sec = parseInt(match[2], 10);
        var ms = parseInt(match[3], 10);
        if (match[3].length === 2) ms *= 10;
        
        var time = min * 60 + sec + ms / 1000;
        var content = line.replace(timeReg, '').trim();
        if (content) {
          result.push({ time: time, text: content });
        }
      } else {
        // 无时间轴，作纯文本处理
        if (!result.length) {
           // 如果没解析出时间轴，用特殊标记
           return text.split('\n').filter(l=>l.trim()).map(l => ({ time: -1, text: l.trim() }));
        }
      }
    }
    return result;
  }

  function loadLyrics(track) {
    currentLyrics = [];
    currentLyricIndex = -1;
    npLyricsEl.innerHTML = '<div class="np-lyrics-empty">暂无歌词</div>';
    
    if (!track || !track.lyrics) return;
    
    var lStr = track.lyrics;
    // 粗略判断是否为 LRC/内联文本，还是 URL 路径
    if (lStr.indexOf('[') === 0 || lStr.indexOf('\n') !== -1 || lStr.length > 150) {
      renderLyrics(parseLRC(lStr));
    } else {
      fetch(lStr)
        .then(r => {
          if (!r.ok) throw new Error();
          return r.text();
        })
        .then(text => {
          if (currentId === track.id) {
            renderLyrics(parseLRC(text));
          }
        })
        .catch(e => {
          if (currentId === track.id) {
            npLyricsEl.innerHTML = '<div class="np-lyrics-empty">歌词加载失败或跨域</div>';
          }
        });
    }
  }

  function renderLyrics(lyrics) {
    currentLyrics = lyrics;
    currentLyricIndex = -1;
    if (!lyrics.length) {
      npLyricsEl.innerHTML = '<div class="np-lyrics-empty">暂无歌词</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < lyrics.length; i++) {
      html += '<div class="np-lyric-line" data-index="' + i + '">' + esc(lyrics[i].text) + '</div>';
    }
    npLyricsEl.innerHTML = html;
    updateLyricsHighlight(audio.currentTime);
  }

  function updateLyricsHighlight(currentTime) {
    if (!currentLyrics.length) return;
    if (currentLyrics[0].time === -1) return; // 纯文本，不处理高亮

    var idx = -1;
    for (var i = 0; i < currentLyrics.length; i++) {
      if (currentTime >= currentLyrics[i].time) {
        idx = i;
      } else {
        break;
      }
    }

    if (idx !== currentLyricIndex) {
      currentLyricIndex = idx;
      var lines = npLyricsEl.querySelectorAll('.np-lyric-line');
      for (var j = 0; j < lines.length; j++) {
        if (j === idx) {
          lines[j].classList.add('active');
        } else {
          lines[j].classList.remove('active');
        }
      }
      
      // 自动滚动
      if (idx >= 0 && lines[idx]) {
        var lineEl = lines[idx];
        var top = lineEl.offsetTop - npLyricsEl.offsetHeight / 2 + lineEl.offsetHeight / 2;
        npLyricsEl.scrollTo({ top: top, behavior: 'smooth' });
      }
    }
  }

  // ==================== 取色逻辑 ====================

  function lightenColor(rgb, amount){
    return [
      Math.min(255, rgb[0] + amount),
      Math.min(255, rgb[1] + amount),
      Math.min(255, rgb[2] + amount)
    ];
  }

  function extractColorFromImage(url, callback){
    if (!url) return callback(null);
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){
      try {
        var c = document.createElement('canvas');
        var size = 40;
        c.width = size; c.height = size;
        var cx = c.getContext('2d');
        cx.drawImage(img, 0, 0, size, size);
        var data = cx.getImageData(0, 0, size, size).data;
        var r=0,g=0,b=0,n=0;
        for (var i=0;i<data.length;i+=4){
          var pr=data[i], pg=data[i+1], pb=data[i+2], pa=data[i+3];
          if (pa < 128) continue;
          var mx = Math.max(pr,pg,pb), mn = Math.min(pr,pg,pb);
          if (mx - mn < 25) continue; // 跳过灰度色
          var br = (pr+pg+pb)/3;
          if (br < 25 || br > 235) continue; // 跳过极黑极白
          r+=pr; g+=pg; b+=pb; n++;
        }
        if (n === 0) return callback(null);
        callback([Math.round(r/n), Math.round(g/n), Math.round(b/n)]);
      } catch(e){ callback(null); }
    };
    img.onerror = function(){ callback(null); };
    img.src = url;
  }

  var spectrumColor = [45, 90, 74];
  var spectrumColorLight = [127, 191, 168];

  function applyColors(r, g, b) {
    spectrumColor = [r, g, b];
    spectrumColorLight = lightenColor([r,g,b], 70);
    
    // 动态背景渐变（深色、沉浸式）
    // 将主色变暗，混合深底色
    var darkR = Math.floor(r * 0.35);
    var darkG = Math.floor(g * 0.35);
    var darkB = Math.floor(b * 0.35);
    
    // 背景基底渐变
    npBackdrop.style.background = `radial-gradient(circle at 50% 10%, rgba(${r},${g},${b}, 0.4) 0%, rgba(${darkR},${darkG},${darkB}, 0.8) 40%, #0f0f0f 90%)`;
    
    // 唱片中心色
    npVinylDisc.style.setProperty('--vinyl-label', `rgb(${r},${g},${b})`);
  }

  function updateTrackColors(track) {
    // 默认色
    applyColors(45, 90, 74);
    if (!track || !track.cover) return;
    
    extractColorFromImage(track.cover, function(rgb){
      if (rgb) {
        applyColors(rgb[0], rgb[1], rgb[2]);
      }
    });
  }

  // ==================== 数据加载 ====================

  function buildCandidates(rawInput){
    var input = (rawInput || '').trim();
    if (input) return [input];
    var list = ['./manifest.json', '/manifest.json'];
    var seen = {}, out = [];
    for (var i = 0; i < list.length; i++){
      var abs = absoluteUrl(list[i]);
      if (!seen[abs]){ seen[abs] = true; out.push(list[i]); }
    }
    return out;
  }

  function fetchManifest(url){
    return fetch(url, { cache: 'no-cache' })
      .then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function(text){
        var data;
        try { data = JSON.parse(text); }
        catch(e){ throw new Error('不是有效的 JSON'); }
        if (!data || !Array.isArray(data.tracks)) throw new Error('缺少 tracks 数组');
        return data;
      });
  }

  function fetchFirstAvailable(candidates){
    return new Promise(function(resolve, reject){
      var i = 0, errors = [];
      function next(){
        if (i >= candidates.length){
          reject(new Error(errors.length ? errors[errors.length - 1] : '未找到清单'));
          return;
        }
        var url = candidates[i++];
        fetchManifest(url)
          .then(function(data){ resolve({ url: url, data: data }); })
          .catch(function(e){
            errors.push(absoluteUrl(url) + '：' + e.message);
            next();
          });
      }
      next();
    });
  }

  function updateManifestHints(){
    var raw = (sourceState.manifestUrl || '').trim();
    var resolved = raw ? absoluteUrl(raw) : (currentManifestUrl ? absoluteUrl(currentManifestUrl) : absoluteUrl('./manifest.json'));
    var label = raw ? '自定义清单' : (currentManifestUrl ? '自动（当前站点）' : '自动（当前站点，待验证）');
    
    if (settingsCurrent) settingsCurrent.innerHTML = '<strong>' + esc(label) + '</strong><br>' + esc(resolved);
    if (currentManifestEl) {
      if (currentManifestUrl) currentManifestEl.innerHTML = '<strong>' + esc(label) + '</strong><br>' + esc(absoluteUrl(currentManifestUrl));
      else currentManifestEl.textContent = '未加载';
    }
  }

  function normalizeSongs(rawSongs, baseUrl){
    var out = [];
    for (var i = 0; i < rawSongs.length; i++){
      var s = rawSongs[i];
      if (!s || typeof s !== 'object') continue;
      out.push({
        id: s.id || ('s' + i),
        title: s.title || '未命名',
        artist: s.artist || '',
        album: s.album || '',
        category: s.category || '未分类',
        desc: s.desc || '',
        duration: s.duration || 0,
        src: resolveAsset(s.src, baseUrl),
        cover: resolveAsset(s.cover, baseUrl),
        lyrics: resolveAsset(s.lyrics, baseUrl)
      });
    }
    return out;
  }

  function refreshLibrary(){
    listEl.setAttribute('aria-busy', 'true');
    metaEl.textContent = '正在加载清单…';

    fetchFirstAvailable(buildCandidates(sourceState.manifestUrl))
      .then(function(res){
        currentManifestUrl = res.url;
        tracks = normalizeSongs(res.data.tracks, absoluteUrl(res.url));
        activeCat = '全部';
        computeFiltered();
        renderTabs();
        if (!getTrack(currentId)) currentId = filtered[0] ? filtered[0].id : (tracks[0] ? tracks[0].id : null);
        
        renderHero();
        renderList();
        renderRank();
        renderSources();
        updateMeta();
        updatePlayerBar();
        syncPlayUI();
        updateManifestHints();
        applyRestoredPlayerState();
        prepareSpectrum();
      })
      .catch(function(e){
        currentManifestUrl = '';
        tracks = []; filtered = []; currentId = null; activeCat = '全部';
        var hint = sourceState.manifestUrl ? ('无法读取清单：' + e.message) : '当前站点未找到可用的 manifest.json。';
        metaEl.textContent = '清单加载失败';
        heroEl.innerHTML = '<div class="state">' + esc(hint) + '</div>';
        listEl.innerHTML = '<div class="state">' + esc(hint) + '</div>';
        listEl.setAttribute('aria-busy', 'false');
        rankEl.innerHTML = ''; sourceEl.innerHTML = '';
        renderTabs();
        updatePlayerBar();
        syncPlayUI();
        updateManifestHints();
      });
  }

  function computeFiltered(){
    if (activeCat === '全部'){ filtered = tracks.slice(); }
    else {
      filtered = [];
      for (var i = 0; i < tracks.length; i++){
        if (tracks[i].category === activeCat) filtered.push(tracks[i]);
      }
    }
  }

  function renderTabs(){

    if (cats.indexOf(activeCat) === -1) activeCat = '全部';
    tabsEl.innerHTML = cats.map(function(c){

  function playTrack(id, forcePlay){
    var t = getTrack(id);
    if (!t || !t.src) return;
    if (id === currentId && !forcePlay){ togglePlay(); return; }

    currentId = id;
    audio.src = t.src;
    audio.play().catch(function(e){ console.warn('播放失败', e); });
    updatePlayerBar();
    syncPlayUI();
    loadLyrics(t);

  function togglePlay(){
    if (!currentId){ if (filtered.length) playTrack(filtered[0].id); return; }
    var t = getTrack(currentId);
    if (audio.paused) {
      if (!audio.src && t && t.src) audio.src = t.src;
      ensureAudioContext();
      audio.play().catch(function(e){ console.warn('播放失败', e); });
    } else {
      audio.pause();
    }

  function nextTrack(){

    var i = indexInFiltered(currentId), n;
    if (shuffleOn) n = Math.floor(Math.random() * filtered.length);
    else { n = (i + 1) % filtered.length; if (i === -1) n = 0; }
    playTrack(filtered[n].id, filtered.length === 1);
  }

  function prevTrack(){
    if (!filtered.length) return;
    var i = indexInFiltered(currentId), n;
    if (shuffleOn) n = Math.floor(Math.random() * filtered.length);
    else { n = (i - 1 + filtered.length) % filtered.length; if (i === -1) n = 0; }
    playTrack(filtered[n].id, filtered.length === 1);

    var lastRect  = npCover.getBoundingClientRect();

    if (firstRect.width && lastRect.width){

      var sx = firstRect.width / lastRect.width, sy = firstRect.height / lastRect.height;
      npCover.style.transformOrigin = 'top left';
      var anim = npCover.animate([
        { transform: 'translate(0,0) scale(1,1)' },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')' }
      ], { duration: 400, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'forwards' });
      anim.onfinish = function(){ finish(); anim.cancel(); };
    } else finish();
  }

  // ==================== 频谱动画 ====================

  var audioCtx = null, analyser = null, freqData = null, sourceNode = null;
  var hasRealAudioData = false, audioCtxFailed = false;
  var npSpectrumCanvas = document.getElementById('np-spectrum');
  var barSpectrumCanvas = document.getElementById('bar-spectrum');
  var npSpectrumCtx = npSpectrumCanvas.getContext('2d');
  var barSpectrumCtx = barSpectrumCanvas.getContext('2d');
  var spectrumRAF = null, spectrumActive = false;

  function setupAnalyser(){
    if (audioCtx || audioCtxFailed) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ audioCtxFailed = true; return; }
    try {
      audioCtx = new AC();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.82;
      sourceNode = audioCtx.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      freqData = new Uint8Array(analyser.frequencyBinCount);
    } catch(e){ audioCtx = null; audioCtxFailed = true; }
  }

  function ensureAudioContext(){
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
  }

  function prepareSpectrum(){
    if (audioCtx || audioCtxFailed || !tracks.length) return;
    var allSame = true;
    for (var i = 0; i < tracks.length; i++){
      if (tracks[i].src && !isSameOriginUrl(tracks[i].src)){ allSame = false; break; }
    }
    if (allSame) setupAnalyser();
  }

  function generateFakeData(t){
    var arr = new Uint8Array(64);
    for (var i=0;i<64;i++){
      var phase = i * 0.21;
      var v1 = Math.sin(t*0.0023 + phase) * 0.5 + 0.5;
      var v2 = Math.sin(t*0.0007 + phase*0.5) * 0.3 + 0.7;
      var v3 = Math.sin(t*0.0051 + phase*1.7) * 0.15 + 0.85;
      var freq = 1 - (i/64) * 0.4;
      arr[i] = Math.floor(v1 * v2 * v3 * freq * 255);
    }
    return arr;
  }

  function drawSpectrum(canvas, ctx, data, isFullScreen){
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;

    if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
      canvas.width = Math.round(w*dpr);
      canvas.height = Math.round(h*dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (!data || !data.length) return;

    var usable = Math.floor(data.length * 0.7);
    // 动态铺满：全屏 8px/柱，底栏 5px/柱
    var targetBarW = isFullScreen ? 8 : 5;
    var bars = Math.floor(w / targetBarW);
    if (usable < bars) bars = usable;
    if (bars <= 0) return;

    var step = Math.max(1, Math.floor(usable / bars));
    var actualBarW = w / bars;
    var gap = Math.max(1, actualBarW * 0.25);
    var bw = actualBarW - gap;

    var grad = ctx.createLinearGradient(0, h, 0, 0);
    grad.addColorStop(0, 'rgba(' + spectrumColor.join(',') + ',0.6)');
    grad.addColorStop(1, 'rgba(' + spectrumColorLight.join(',') + ',0.2)');
    ctx.fillStyle = grad;

    for (var i=0;i<bars;i++){
      var sum = 0, cnt = 0;
      for (var j=0;j<step;j++){
        var idx = i*step + j;
        if (idx < usable){ sum += data[idx]; cnt++; }
      }
      var v = cnt ? sum / cnt / 255 : 0;
      v = Math.pow(v, 0.35); // 夸张度
      var bh = Math.max(2, Math.min(h * 1.15, v * h * 1.25));
      ctx.fillRect(i*actualBarW + gap/2, h - bh, bw, bh);
    }
  }

  function spectrumLoop(t){
    if (!spectrumActive) return;

    var data;
    if (analyser && freqData){
      analyser.getByteFrequencyData(freqData);
      var sum = 0;
      for (var i=0;i<freqData.length;i++) sum += freqData[i];
      if (sum > 100) hasRealAudioData = true;
    }

    if (hasRealAudioData && freqData) data = freqData;
    else data = generateFakeData(t);

    if (npOpen) drawSpectrum(npSpectrumCanvas, npSpectrumCtx, data, true);
    else drawSpectrum(barSpectrumCanvas, barSpectrumCtx, data, false);

    spectrumRAF = requestAnimationFrame(spectrumLoop);
  }

  function startSpectrum(){
    if (!spectrumActive) { spectrumActive = true; spectrumRAF = requestAnimationFrame(spectrumLoop); }
  }

  function stopSpectrum(){
    if (spectrumActive) { spectrumActive = false; if (spectrumRAF) cancelAnimationFrame(spectrumRAF); spectrumRAF = null; }
  }

  // ==================== 设置及事件 ====================

  function loadSourceState(){
    try {
      var raw = localStorage.getItem(SOURCE_KEY);
      if (raw) {
        var obj = JSON.parse(raw);
        if (obj && typeof obj.manifestUrl === 'string') sourceState.manifestUrl = obj.manifestUrl;
      }
    } catch(e){}
    manifestUrlEl.value = sourceState.manifestUrl || '';
    updateManifestHints();
  }

  function saveSourceState(){ try{ localStorage.setItem(SOURCE_KEY, JSON.stringify(sourceState)); }catch(e){} }
  
  var lastSaveTime = 0;
  function savePlayerState(immediate){
    var now = Date.now();
    if (!immediate && now - lastSaveTime < 3000) return;
    lastSaveTime = now;
    var state = {
      trackId: currentId || null,
      currentTime: (audio && isFinite(audio.currentTime)) ? audio.currentTime : 0,
      volume: audio ? audio.volume : 1,
      shuffle: shuffleOn,
      savedAt: now
    };
    try{ localStorage.setItem(PLAYER_KEY, JSON.stringify(state)); }catch(e){}
  }

  function applyRestoredPlayerState(){
    try {
      var raw = localStorage.getItem(PLAYER_KEY);
      if (!raw) return;
      var state = JSON.parse(raw);
      
      if (typeof state.volume === 'number' && isFinite(state.volume)){
        audio.volume = Math.max(0, Math.min(1, state.volume));
        volEl.value = audio.volume;
      }
      if (state.shuffle){ shuffleOn = true; btnShuffle.classList.add('on'); }
      if (!state.trackId) return;
      
      var t = getTrack(state.trackId);
      if (!t || !t.src) return;

      currentId = t.id;
      updatePlayerBar(); renderHero(); renderList();
      liveText.textContent = '已暂停 · ' + t.title;

      audio.src = t.src;
      var seekTo = state.currentTime || 0;
      var onMeta = function(){
        audio.removeEventListener('loadedmetadata', onMeta);
        if (seekTo > 0 && isFinite(audio.duration) && seekTo < audio.duration - 0.5){
          try{ audio.currentTime = seekTo; }catch(e){}
          curTimeEl.textContent = fmt(seekTo);
          seekFill.style.width = (seekTo / audio.duration * 100) + '%';
        }
      };
      audio.addEventListener('loadedmetadata', onMeta);
    } catch(e){}
  }

  function switchSettingsTab(name){
    var tabs = settingsTabs.querySelectorAll('.settings-tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === name);
    var contents = settingsModal.querySelectorAll('.settings-tab-content');
    for (var j = 0; j < contents.length; j++) contents[j].hidden = contents[j].getAttribute('data-content') !== name;
  }

  function testManifest(){
    var raw = manifestUrlEl.value.trim();
    settingsStatus.className = 'settings-status'; settingsStatus.textContent = '正在读取…';
    var tried = [], i = 0;
    
    function next(){
      if (i >= buildCandidates(raw).length){
        settingsStatus.className = 'settings-status err';
        settingsStatus.innerHTML = '读取失败。已尝试：<br>' + tried.map(esc).join('<br>');
        return;
      }
      var url = buildCandidates(raw)[i++];
      fetchManifest(url).then(function(data){
        var n = data.tracks.length, withCover = 0;
        for (var k = 0; k < n; k++) if (data.tracks[k].cover) withCover++;
        settingsStatus.className = 'settings-status ok';
        settingsStatus.textContent = '成功（' + absoluteUrl(url) + '），共 ' + n + ' 首，' + withCover + ' 首带封面。';
      }).catch(function(e){ tried.push(absoluteUrl(url) + '：' + e.message); next(); });
    }
    next();
  }

  function saveManifest(){
    var raw = manifestUrlEl.value.trim();
    settingsStatus.className = 'settings-status'; settingsStatus.textContent = '正在验证…';
    var i = 0;
    
    function commit(ok, msg){
      sourceState.manifestUrl = raw; saveSourceState();
      try{ localStorage.removeItem(PLAYER_KEY); }catch(e){}
      currentId = null; audio.pause(); audio.removeAttribute('src');
      settingsStatus.className = 'settings-status ' + (ok ? 'ok' : 'err'); settingsStatus.textContent = msg;
      updateManifestHints();
      setTimeout(function(){ settingsModal.hidden = true; if(!npOpen) document.body.style.overflow = ''; refreshLibrary(); }, ok ? 500 : 900);
    }
    
    function next(){
      if (i >= buildCandidates(raw).length){ commit(false, '验证失败，已保存配置。'); return; }
      fetchManifest(buildCandidates(raw)[i++]).then(function(){ commit(true, '验证通过，已保存。'); }).catch(next);
    }
    next();
  }

  function adjustBodyPadding(){
    document.body.style.paddingBottom = (playerBar.offsetHeight + 24) + 'px';
  }

  // 绑定事件
  audio.addEventListener('play', function(){ isPlaying = true; ensureAudioContext(); startSpectrum(); syncPlayUI(); });
  audio.addEventListener('pause', function(){ isPlaying = false; stopSpectrum(); syncPlayUI(); savePlayerState(true); });
  audio.addEventListener('ended', function(){ savePlayerState(true); nextTrack(); });
  audio.addEventListener('loadedmetadata', function(){ durTimeEl.textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', function(){ updateProgress(); savePlayerState(false); });

  btnPlay.addEventListener('click', togglePlay);
  btnPrev.addEventListener('click', prevTrack);
  btnNext.addEventListener('click', nextTrack);
  btnShuffle.addEventListener('click', function(){ shuffleOn = !shuffleOn; btnShuffle.classList.toggle('on', shuffleOn); savePlayerState(true); });
  seekBar.addEventListener('click', function(e){
    var rect = seekBar.getBoundingClientRect(), ratio = (e.clientX - rect.left) / rect.width;
    if (isFinite(audio.duration) && audio.duration > 0) audio.currentTime = Math.max(0, Math.min(1, ratio)) * audio.duration;
  });
  volEl.addEventListener('input', function(){ audio.volume = parseFloat(volEl.value); savePlayerState(true); });

  pbCover.addEventListener('click', openNowPlaying);
  pbCover.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openNowPlaying(); } });

  npModal.addEventListener('click', function(e){ if (e.target.closest('[data-np-close]')) closeNowPlaying(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && npOpen) closeNowPlaying(); else if (e.key === 'Escape' && !settingsModal.hidden) { settingsModal.hidden = true; if(!npOpen) document.body.style.overflow = ''; } });
  npPlayBtn.addEventListener('click', togglePlay);
  npPrevBtn.addEventListener('click', prevTrack);
  npNextBtn.addEventListener('click', nextTrack);

  tabsEl.addEventListener('click', function(e){
    var btn = e.target.closest('.cat-tab'); if (!btn) return;
    activeCat = btn.getAttribute('data-cat'); computeFiltered(); renderTabs(); renderList(); renderHero(); updateMeta();
  });
  listEl.addEventListener('click', function(e){ var item = e.target.closest('.track-item'); if (item) playTrack(item.getAttribute('data-id')); });
  heroEl.addEventListener('click', function(e){ var btn = e.target.closest('.hero-play'); if (btn) { var id = btn.getAttribute('data-id'); if (id === currentId) togglePlay(); else playTrack(id); } });
  rankEl.addEventListener('click', function(e){ var btn = e.target.closest('.rank-item'); if (btn) playTrack(btn.getAttribute('data-id')); });

  settingsBtn.addEventListener('click', function(){
    manifestUrlEl.value = sourceState.manifestUrl || '';
    switchSettingsTab('config'); settingsStatus.textContent = ''; updateManifestHints();
    settingsModal.hidden = false; document.body.style.overflow = 'hidden';
  });
  footerSettingsLink.addEventListener('click', function(e){ e.preventDefault(); settingsBtn.click(); });
  settingsModal.addEventListener('click', function(e){ if (e.target.closest('[data-settings-close]')) { settingsModal.hidden = true; if(!npOpen) document.body.style.overflow = ''; } });
  settingsTabs.addEventListener('click', function(e){ var btn = e.target.closest('.settings-tab'); if (btn) switchSettingsTab(btn.getAttribute('data-tab')); });
  pfTest.addEventListener('click', testManifest);
  pfSave.addEventListener('click', saveManifest);
  manifestUrlEl.addEventListener('keydown', function(e){ if (e.key === 'Enter') testManifest(); });

  window.addEventListener('beforeunload', function(){ savePlayerState(true); });
  window.addEventListener('pagehide', function(){ savePlayerState(true); });
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') savePlayerState(true); });
  window.addEventListener('resize', adjustBodyPadding);

  // 启动
  loadSourceState();
  refreshLibrary();
  adjustBodyPadding();
})();
</script>
</body>
</html>
